<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Bug Tickets</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--side:#fafbfc;--text:#1f2328;--muted:#6b7280;--line:#e5e7eb;--hover:#f1f3f6;--sel:#eef2ff;--accent:#3f76ff;--chip:#f1f3f6;
--urgent:#ef4444;--high:#f97316;--medium:#eab308;--low:#3b82f6;--done:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111317;--panel:#17191e;--side:#14161a;--text:#e6e8eb;--muted:#9aa3ae;--line:#2a2e35;--hover:#1f2228;--sel:#1e2540;--chip:#22262d}}
:root[data-theme=dark]{--bg:#111317;--panel:#17191e;--side:#14161a;--text:#e6e8eb;--muted:#9aa3ae;--line:#2a2e35;--hover:#1f2228;--sel:#1e2540;--chip:#22262d}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.nav{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 8px;margin-bottom:12px}.ws .lg{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.nav a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:13px}.nav a.on{background:var(--sel);color:var(--accent);font-weight:600}.nav .sec{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin:14px 8px 4px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{font-weight:600}.crumb span{color:var(--muted);font-weight:400}
.draft{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select,.tools button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px}
.body{display:grid;grid-template-columns:minmax(320px,440px) 1fr;min-height:0;flex:1}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.grp{position:sticky;top:0;background:var(--side);border-bottom:1px solid var(--line);padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;z-index:1}
.row{display:grid;grid-template-columns:18px 72px 1fr;gap:8px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.key{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace;padding-top:1px}
.rt{font-size:13px;line-height:1.35}.rm{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pri{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;margin-top:2px}
.pri svg{width:14px;height:14px}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;border:2px dashed var(--muted)}
.detail{overflow:auto;display:grid;grid-template-columns:1fr 280px;min-width:0}
.content{padding:22px 28px;min-width:0}.props{border-left:1px solid var(--line);padding:18px;background:var(--panel)}
.dk{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:13px}
h1{font-size:22px;line-height:1.3;margin:6px 0 16px}
.desc h3{font-size:14px;margin:18px 0 6px}.desc p,.desc li{margin:4px 0}.desc ol,.desc ul{padding-left:22px;margin:4px 0}
.desc blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--hover);border-radius:4px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.cmp th{background:var(--hover)}
.m{border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.sec2{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}.sec2 h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.att{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer}
.att img{width:100%;height:120px;object-fit:cover;object-position:top;display:block;background:var(--hover)}
.att .an{padding:8px 10px;font-size:12px}.att .an b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.att .an span{color:var(--muted)}
.act{font-size:13px;color:var(--muted)}.act div{display:flex;gap:8px;align-items:center;margin:6px 0}.av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.p{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}.p>span:first-child{color:var(--muted)}
.lb{display:flex;flex-wrap:wrap;gap:5px}.lb .chip{color:var(--text)}
.lbd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;flex-direction:column;gap:10px}
.lightbox.on{display:flex}.lightbox img{max-width:96vw;max-height:86vh;border-radius:6px;background:#fff}.lightbox .cap{color:#fff;font-size:13px}.lightbox a{color:#93c5fd}
.empty{padding:40px;color:var(--muted);text-align:center}
@media (max-width:1100px){.detail{grid-template-columns:1fr}.props{border-left:none;border-top:1px solid var(--line)}}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav{display:none}.body{grid-template-columns:1fr}.list{max-height:40vh;border-right:none;border-bottom:1px solid var(--line)}.content{padding:16px}}
</style></head><body>

<script>
const B=[{"n":1,"key":"CV-001","id":"CVS-D08","title":"Date-time 'today/yesterday/tomorrow' criteria use the UTC day instead of the tenant timezone (Cairo)","caseTitle":"today, yesterday and tomorrow resolve in the tenant timezone (Cairo), not UTC","area":"Criteria","priority":"High","labels":["Bug","Custom Views","Criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed leads QA CV L01…L12 exist (spec §1.2).\nTenant timezone is Africa/Cairo; D is the execution date in Cairo.\nDate Time Permission is set on the seed leads as listed in Test Data.\nThe test is run at 23:50 Cairo and again at 00:10 Cairo (the UTC date differs from the Cairo date around midnight).","steps":"1. Open Leads → New custom view 'QA CV date-rel' with Name starts_with 'QA CV' and Date Time Permission today; Save.\n2. At 23:50 Cairo, open the view and record the result; edit to yesterday and tomorrow and record each.\n3. At 00:10 Cairo (next day), repeat step 2.\n4. Cross-check: apply the same condition in the Leads Filter panel, or call GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n5. Cleanup: delete 'QA CV date-rel' and purge it from the Recycle Bin.","data":"L01 = D-1 23:50 Cairo\nL02 = D 00:10 Cairo\nL03 = D 23:50 Cairo\nL04 = D+1 00:10 Cairo\nRun times: 23:50 and 00:10 Cairo","expected":"At 23:50 on D: today → L02, L03 · yesterday → L01 · tomorrow → L04. At 00:10 on D+1: today → L04 · yesterday → L02, L03 · tomorrow → none of L01–L04. Results follow the Cairo date, never the UTC date, and match the module filter.","actual":"Date Time Permission seeds: T01 4 Oct 23:50, T02 5 Oct 00:10, T03 5 Oct 23:50, T04 6 Oct 00:10 Cairo (stored UTC). At 13:37 Cairo on 5 Oct: today -> T03, T04 (expected T02, T03); yesterday -> T01, T02 (expected T01); tomorrow -> none (expected T04). The grid shows T04 as '06/10/2026 12:10 AM' inside the Today view. The relative operators use the UTC date, not the Cairo date. Grid and module filter agree. (The case's 23:50 / 00:10 run times were not needed: the UTC-vs-Cairo split shows at any time.)","started":"2026-10-05T10:38:50Z","rows":[["Date boundary","Not checked live this run (4 Oct: user time zone)","UTC day used for today/yesterday/tomorrow","na"]],"att":[{"name":"D08-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D08-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":98001},{"name":"D08-today-view-grid.png","path":"browser-sessions/owner-112040-7855/screenshots/D08-today-view-grid.png","kind":"TAVI screenshot","size":74852}]},{"n":2,"key":"CV-002","id":"CVS-E12","title":"A user without the review permission can filter by review_status through the views API (condition accepted and applied), exposing review data","caseTitle":"The review_status field is not offered to a user without the review permission","area":"Related criteria","priority":"High","labels":["Bug","Custom Views","Related criteria","Security"],"pre":"Logged in as USER (User profile).\nLogged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nUSER's profile does not have the review permission (confirm in profile settings).","steps":"1. As OWNER, open Leads → New custom view and confirm Review status is offered in the field list; Cancel.\n2. As USER, open Leads → New custom view and search the field list for Review status.\n3. As USER, POST /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views named 'QA CV review-gate' with a review_status condition.\n4. Record the status code and, if created, GET the view.\n5. Cleanup: delete 'QA CV review-gate' and purge it from the Recycle Bin.","data":"Field: review_status (Review status)\nAccounts: OWNER (control), USER (no review permission)","expected":"OWNER is offered Review status; USER is not. The API refuses the review_status condition from USER (or ignores it — record which); USER never gets review data through a view.","actual":"Field list: ALT1 (CRM Admin) is offered 'Review Status'; test user 1 (User profile, no review permission) is not (only 'Approval Status'). FAIL: as test user 1, POST view 'QA CV review-gate' with review_status equals 'approved' -> 201, stored as sent, and the view filters on it: 4 of test user 1's 20 visible leads are returned (pending / rejected / not_submitted -> 0). The records filter API also accepts review_status from test user 1. A user without the review permission gets review data through a view.","started":"2026-10-05T11:44:00Z","rows":[["Review Status criterion","Not checked live","Not offered in the UI, but API accepts and applies it (201)","na"]],"att":[{"name":"E12-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-E12-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":62720},{"name":"E12-api-review-status.png","path":"browser-sessions/owner-112040-7855/screenshots/E12-api-review-status.png","kind":"TAVI screenshot","size":19816}]},{"n":3,"key":"CV-003","id":"CVS-K07","title":"A criterion on a field hidden from the viewer exposes its value in the view editor and the view API","caseTitle":"A public view filtering on a field hidden from the viewer follows the Q13 decision and never exposes the value","area":"Security","priority":"High","labels":["Bug","Custom Views","Security","Security"],"pre":"Logged in as OWNER (Tenant Owner).\nLogged in as USER (User profile).\nA Leads field is hidden for the User profile and holds a value on 'QA CV L03' only.\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\n🔒 Needs a working lower-profile account — Inconclusive while the §1.4 blocker stands.","steps":"1. As OWNER, create 'QA CV k7' on Leads with Sharing = Everyone and one criterion: \u003chidden field> equals \u003cvalue on QA CV L03>.\n2. As USER, open 'QA CV k7' and note the records returned.\n3. As USER, open Edit on the view and read the criteria.\n4. As USER, send GET /api/v1/modules/{m}/views/{v} and read settings.criteria.\n5. Record what USER can infer about the hidden field from the name, criteria and results.","data":"m = Leads (841043e1-c078-41f9-8d6e-dfd61bee45c3)\nHidden field: any Leads field set to Hidden for the User profile\nCleanup: delete 'QA CV k7' and purge it from the Recycle Bin.","expected":"Behaviour matches the Q13 decision: either criteria on hidden fields are not allowed on shared views, or the criterion is masked and read-only (\"Some fields in this view's criteria are deleted or hidden from you: …\") and the exposure is documented. The hidden value never appears in the UI or the API response.","actual":"Company is hidden from test user 1 (User profile). QA CV L03 temporarily owned by test user 1 (restored afterwards) so the record is visible but its Company is not. ALT1's 'QA CV k7' (Everyone) filters Company equals \u003cL03's company>. As test user 1: the editor shows the banner 'Some fields in this view's criteria are deleted or hidden from you: company. The view still filters on them.' BUT the criterion row still displays the hidden field and its actual value (Company Equals 'شركة الأمل') in the value box; GET /modules/{Leads}/views/{k7} also returns settings.criteria with the value in plain text; and the grid shows QA CV L03 as the match - so test user 1 learns L03's hidden Company value from the UI and the API.","started":"2026-10-05T14:46:15Z","rows":[["Hidden field value in criteria","Not checked live","Shown in the editor and returned by the view API","na"]],"att":[{"name":"K07-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-K07-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":115048},{"name":"K07-hidden-field-criteria.png","path":"browser-sessions/owner-112040-7855/screenshots/K07-hidden-field-criteria.png","kind":"TAVI screenshot","size":86204}]},{"n":4,"key":"CV-004","id":"CVS-B14","title":"?view= with a deleted or foreign view ID falls back to the last-used view instead of All Leads","caseTitle":"The ?view= URL opens permitted views and falls back safely for others","area":"Picker & tabs","priority":"Medium","labels":["Bug","Custom Views","Picker & tabs"],"pre":"Logged in as OWNER (Tenant Owner).\nIDs are known for: own 'QA CV x'; 'QA CV shared-to-me' shared by USER; deleted 'QA CV gone'; USER's private 'QA CV user-private'.\nRequires a working lower-profile account (spec §1.4) — mark the shared and foreign checks Inconclusive, not Fail, until one is provided.","steps":"1. Open /modules/{m}?view={id} with the ID of 'QA CV x'.\n2. Repeat with the ID of 'QA CV shared-to-me'.\n3. Repeat with the ID of 'QA CV gone'.\n4. Repeat with the ID of 'QA CV user-private'.\n5. Check the browser console after each.","data":"Own: 'QA CV x'\nShared: 'QA CV shared-to-me'\nDeleted: 'QA CV gone'\nForeign: 'QA CV user-private'","expected":"The own and shared views open. The deleted and foreign IDs fall back to All Leads with no crash, and nothing of the foreign view (name, criteria, records) is shown. Cleanup: delete every 'QA CV' view used and purge them from the Recycle Bin.","actual":"?view= own QA CV x -> opens; QA CV shared-to-me (shared by test user 1) -> opens; deleted QA CV gone and test user 1's private QA CV user-private -> toast 'That view is no longer available. Showing your default view.', ?view= removed, nothing of the foreign view shown, no console errors. FAIL: the fallback is not All Leads - both land on the last-used view (QA CV close11).","started":"2026-10-05T08:55:49Z","rows":[["Message","\"This action cannot be performed. The view … is not available. Go To All Leads\"","\"That view is no longer available. Showing your default view.\"","same"],["Where the user lands","Offered All Leads","Last-used view (QA CV close11), not All Leads","differs"]],"att":[{"name":"B14-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-B14-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":211718},{"name":"B14-deleted-fallback.png","path":"browser-sessions/owner-112040-7855/screenshots/B14-deleted-fallback.png","kind":"TAVI screenshot","size":128335},{"name":"zoho-B14-invalid-view-id.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-B14-invalid-view-id.png","kind":"Zoho reference","size":88296},{"name":"B14-foreign-fallback.png","path":"browser-sessions/owner-112040-7855/screenshots/B14-foreign-fallback.png","kind":"TAVI screenshot","size":128336}]},{"n":5,"key":"CV-005","id":"CVS-B15","title":"List preferences changed in two browser tabs: the later write silently overwrites the earlier one (lost update, no version conflict)","caseTitle":"Preferences changed in two browser tabs are saved consistently","area":"Picker & tabs","priority":"Medium","labels":["Bug","Custom Views","Picker & tabs","Concurrency"],"pre":"Logged in as OWNER (Tenant Owner).\nLeads holds 'QA CV A' and 'QA CV B', both shown as view tabs.\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.","steps":"1. Open Leads in browser tab 1 and select 'QA CV A'.\n2. Open Leads in browser tab 2 and select 'QA CV B'.\n3. In tab 1, close the view tab 'QA CV B'.\n4. In tab 2, close the view tab 'QA CV A'.\n5. Send GET /api/v1/modules/{m}/list-preferences.","data":"Views: 'QA CV A', 'QA CV B'","expected":"Behaviour is consistent and documented: record the final lastListViewId, openListViewIds and recentlyClosedListViewIds. If one tab's change is lost (lost update), record it as a possible bug against the NDC-1869 note. Cleanup: delete 'QA CV A' and 'QA CV B' and purge them from the Recycle Bin.","actual":"QA CV A and QA CV B shown as tabs. Tab 1 selected A, tab 2 selected B. Tab 1 closed B (its tab bar: A). Tab 2 (stale) closed A (its tab bar: B). Final list-preferences (version 193): openListViewIds has B and not A; recentlyClosedListViewIds starts with A and does not contain B; after reloading tab 1 the B tab is back. Lost update: tab 2's write replaced the whole preference object and undid tab 1's close; no conflict was raised.","started":"2026-10-05T09:07:05Z","rows":[["Concurrent preference changes","Not checked live","The second tab's save silently replaces the first (no merge, no message)","na"]],"att":[{"name":"B15-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-B15-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":169240},{"name":"B15-tab1-after-reload.png","path":"browser-sessions/owner-112040-7855/screenshots/B15-tab1-after-reload.png","kind":"TAVI screenshot","size":145629}]},{"n":6,"key":"CV-006","id":"CVS-D05","title":"View API accepts non-numeric Amount values ('abc', '15,000', '1e9') and stores them as raw strings that match nothing","caseTitle":"Odd numeric input is normalised or rejected with a message and is never stored as 15","area":"Criteria","priority":"Medium","labels":["Bug","Custom Views","Criteria","API"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed deals QA CV D01…D08 exist with Amount, in order: 0, 9999.99, 10000, 10000.01, empty, -1 (if negative is allowed), 15000, 1000000000 (spec §1.2).","steps":"1. Open Deals → New custom view 'QA CV amount-format' with Amount equals '15,000'; Save.\n2. GET /api/v1/modules/f42cbafd-ab4e-4a6b-a40c-02c1d0ecb430/views/{id} and read the stored value; record the deals returned.\n3. Repeat steps 1–2 for every value in Test Data (edit the same view).\n4. POST /api/v1/modules/f42cbafd-ab4e-4a6b-a40c-02c1d0ecb430/views with each value sent as a string and record the status code.\n5. Cross-check: apply Amount equals the stored value in the Deals Filter panel, or call GET /api/v1/modules/f42cbafd-ab4e-4a6b-a40c-02c1d0ecb430/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n6. Cleanup: delete 'QA CV amount-format' and purge it from the Recycle Bin.","data":"'15,000' (thousands separator)\n'١٥٠٠٠' (Arabic-Indic digits)\n'1e9'\n'-1'\n'abc'\nRecords: D07 = 15000, D08 = 1000000000, D06 = -1","expected":"'15,000' → stored as 15000 and returns D07, or rejected with a message; never stored as 15. '١٥٠٠٠' → normalised to 15000 (D07) or rejected with a message; never stored as 15 or 0. '1e9' → 1000000000 (D08) or rejected with a message. '-1' → accepted; returns D06 if negative amounts exist. 'abc' → rejected with a message, save blocked; API returns 400/422 with no view created. No 500.","actual":"Editor (Amount box is input type=number): Arabic-Indic digits and 'abc' leave the box empty and Save is blocked with 'Complete this row (field, operator and value) or remove it.'; '-1' saves and returns D06. FAIL (API): POST with value '15,000', Arabic-Indic '15000', '1e9' and 'abc' -> all 201 Created, the raw string is stored and the view matches 0 records - 'abc' is not rejected (expected 400/422) and '15,000' / '1e9' are neither normalised (15000 / 1000000000) nor rejected.","started":"2026-10-05T10:38:20Z","rows":[["Amount value \"abc\"","Cannot be typed (currency number box)","API 201 Created, stored as \"abc\"","gap"],["\"1e9\" / \"15,000\"","Numbers only","Stored as raw strings, not normalised","gap"]],"att":[{"name":"D05-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D05-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":126607},{"name":"D05-api-amount-accepted.png","path":"browser-sessions/owner-112040-7855/screenshots/D05-api-amount-accepted.png","kind":"TAVI screenshot","size":20809},{"name":"zoho-D05-amount-1e9.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-D05-amount-1e9.png","kind":"Zoho reference","size":110126}]},{"n":7,"key":"CV-007","id":"CVS-D16","title":"Lookup criteria in the view editor take free text only (no record picker); a typed record name is saved literally and matches nothing","caseTitle":"Lookup equals, not_equal_to and empty return the correctly linked records","area":"Criteria","priority":"Medium","labels":["Bug","Custom Views","Criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed leads QA CV L01…L12 exist (spec §1.2).\nX and Y are two records of the Lookup Permission target module; Lookup Permission is set on the seed leads as listed in Test Data.","steps":"1. Open Leads → New custom view 'QA CV lookup' with Name starts_with 'QA CV' and Lookup Permission equals X; Save and record the result.\n2. Edit row 2 to not_equal_to X, then empty; record each.\n3. Cross-check: apply the same Lookup Permission condition in the Leads Filter panel, or call GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n4. Cleanup: delete 'QA CV lookup' and purge it from the Recycle Bin.","data":"L01 → X · L02 → X · L03 → Y · L04 empty","expected":"equals X → L01, L02. not_equal_to X → L03 (L04 handled as the module filter does). empty → L04 only. Counts equal the module filter.","actual":"Seeds Q01 -> contact X (QA CV C01), Q02 -> X, Q03 -> Y (QA CV C02), Q04 empty. API with the stored form '\u003cmodule id>:\u003crecord id>': equals X -> Q01, Q02; not_equal_to X -> Q03, Q04 (empty included); is_empty -> Q04; is_not_empty -> Q01, Q02, Q03 - grid equals the module filter. FAIL (editor): the value for Lookup Permission is a plain text box ('Value for Lookup Permission') with no record search, picker or suggestions; typing the record name 'QA CV C01' saves the literal text and the view returns 0 records. A bare record id also matches nothing. A user cannot build a working lookup criterion in the editor.","started":"2026-10-05T10:40:05Z","rows":[["Lookup value control","Searchable record picker","Free-text box","differs"]],"att":[{"name":"D16-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D16-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":178553},{"name":"D16-lookup-value-control.png","path":"browser-sessions/owner-112040-7855/screenshots/D16-lookup-value-control.png","kind":"TAVI screenshot","size":93544},{"name":"zoho-D16-lookup-picker.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-D16-lookup-picker.png","kind":"Zoho reference","size":127351}]},{"n":8,"key":"CV-008","id":"CVS-D19","title":"View API accepts an operator that does not fit the field type (Amount 'contains' -> 201)","caseTitle":"A view definition with an unknown field or operator is rejected by the API with 400/422","area":"Criteria","priority":"Medium","labels":["Bug","Custom Views","Criteria","API"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.","steps":"1. GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views?kind=list and save the list of ids.\n2. POST /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views named 'QA CV bad-field' with condition field 'does_not_exist_c'.\n3. POST again named 'QA CV bad-operator' with a valid field and operator 'xor_like'.\n4. POST /api/v1/modules/f42cbafd-ab4e-4a6b-a40c-02c1d0ecb430/views named 'QA CV wrong-type' with Amount and operator 'contains'.\n5. PATCH an existing QA CV view with the unknown field; record the status code.\n6. GET the views list again and compare with step 1.\n7. Cleanup: delete any 'QA CV' view created by mistake and purge it from the Recycle Bin.","data":"Unknown field: does_not_exist_c\nUnknown operator: xor_like\nOperator not valid for the type: contains on Deals Amount","expected":"Every request returns 400/422 with a validation error — never 200 or 500. No view is created or changed; the views list matches step 1. Cross-check: the same field/operator is not offered in the Leads Filter panel.","actual":"Unknown field does_not_exist_c -> 422 unknown_field 'That field does not exist on this module.'; unknown operator xor_like -> 422 'not a supported operator'; PATCH with the unknown field -> 422, control view unchanged; views list unchanged. FAIL: Deals 'QA CV wrong-type' with Amount (currency) + operator contains -> 201 Created - an operator that is not valid for the field type is accepted.","started":"2026-10-05T10:40:30Z","rows":[["Currency + \"contains\"","Not checked live (Zoho UI offers only numeric operators for Amount)","API 201 Created; editor shows an empty Operator","na"]],"att":[{"name":"D19-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D19-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":135433},{"name":"D19-api-contains-on-currency.png","path":"browser-sessions/owner-112040-7855/screenshots/D19-api-contains-on-currency.png","kind":"TAVI screenshot","size":16849},{"name":"D19-editor-contains.png","path":"browser-sessions/owner-112040-7855/screenshots/D19-editor-contains.png","kind":"TAVI screenshot","size":94526}]},{"n":9,"key":"CV-009","id":"CVS-D24","title":"Arabic UI: the criteria pattern '(1 or 2) and (3 or 4)' is displayed as '( and (3 or 4) (or 2 1) )'","caseTitle":"In the Arabic UI the pattern's row numbers, brackets and and/or read correctly","area":"Criteria","priority":"Medium","labels":["Bug","Custom Views","Criteria","RTL / Arabic"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed leads QA CV L01…L12 exist (spec §1.2).\nThe interface language is switched to Arabic.","steps":"1. Open Leads → New custom view 'QA CV rtl-pattern' with four rows: Lead Status equals S1, Lead Status equals S2, Comment is_not_empty, Name starts_with 'QA CV'.\n2. Enter the pattern (1 or 2) and (3 or 4) and read it as displayed.\n3. Save, reopen the editor and read the pattern again.\n4. Switch to English, open the same view and compare the results.\n5. Cross-check: apply the same pattern in the Leads Filter panel, or call GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n6. Cleanup: delete 'QA CV rtl-pattern' and purge it from the Recycle Bin.","data":"Pattern: (1 or 2) and (3 or 4)\nLanguage: Arabic, then English","expected":"In Arabic, row numbers, brackets and the and/or connectors display in the correct order with brackets correctly paired (not reversed or misplaced). The results are identical in Arabic and English and equal the module filter count.","actual":"Run as ALT1. 'QA CV rtl-pattern' with rows Lead Status = No Answer, Lead Status = Busy, Comment is not empty, Full Name starts with 'QA CV' and pattern '(1 or 2) and (3 or 4)'. UI switched to Arabic (dir=rtl). FAIL: the editor shows the pattern as '( and (3 or 4) (or 2 1) )' - brackets and token order scrambled (English text inside an RTL line without isolation). Results identical in Arabic and English (9 records). Switched back to English afterwards.","started":"2026-10-05T11:29:00Z","rows":[["Pattern display in Arabic","Not checked live (Zoho language change)","Keywords and brackets reordered - unreadable","na"]],"att":[{"name":"D24-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D24-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":108745},{"name":"D24-arabic-pattern.png","path":"browser-sessions/owner-112040-7855/screenshots/D24-arabic-pattern.png","kind":"TAVI screenshot","size":93806}]},{"n":10,"key":"CV-010","id":"CVS-D25","title":"'Last Activity' in view criteria is the record's modified time; adding a note does not update it","caseTitle":"Last Activity Time can be used as a criteria field and follows record activity","area":"Criteria","priority":"Medium","labels":["Bug","Custom Views","Criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nSeed records QA CV L01…L12 (Leads) and QA CV D01…D08 (Deals) exist.\nA note was added to 'QA CV L01' today; 'QA CV L02' has had no activity for more than 7 days.","steps":"1. On Leads, open New custom view 'QA CV last-activity' and open the criteria field list.\n2. Look for Last Activity Time.\n3. If offered, set Last Activity Time, Age in Days = 7, add Lead Name starts with QA CV, and Save.\n4. Read the results.\n5. Add a note to 'QA CV L02' and reload the view.","data":"Field: Last Activity Time · Operator: Age in Days = 7\nCleanup: delete the notes; delete 'QA CV last-activity' and purge it from the Recycle Bin.","expected":"Last Activity Time is in the criteria field list with the date-time operators. The view returns 'QA CV L01' and not 'QA CV L02'; after the note is added, 'QA CV L02' is returned too (NDC-1868 P1-5; Zoho offers the field — seen live 2 Oct 2026). If the field is not offered, mark Fail and note it.","actual":"'Last Activity' is offered in the criteria field list with the date-time operators. FAIL: it is the record's modified time, not an activity time - a note added to QA CV L02 (POST notes 201) left last_modified_at unchanged (08:47:45Z) and a 'last 1 hour' Last Activity filter does not return L02.","started":"2026-10-05T10:47:30Z","rows":[["Field offered","\"Last Activity Time\"","\"Last Activity\"","same"],["Adding a note updates it","Yes (activities count)","No - it is last_modified_at","differs"]],"att":[{"name":"D25-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D25-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":143198},{"name":"D25-last-activity-api.png","path":"browser-sessions/owner-112040-7855/screenshots/D25-last-activity-api.png","kind":"TAVI screenshot","size":21882},{"name":"D25-zoho-last-activity-field.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/D25-zoho-last-activity-field.png","kind":"Zoho reference","size":135337}]},{"n":11,"key":"CV-011","id":"CVS-E2E-1","title":"After sign-out/sign-in Leads does not reopen the working view the user had open","caseTitle":"A pinned working view survives opening a record and signing out and back in","area":"End-to-end","priority":"Medium","labels":["Bug","Custom Views","End-to-end"],"pre":"Logged in as OWNER (Tenant Owner).\nSeed records QA CV L01…L12 (Leads) and QA CV D01…D08 (Deals) exist.\nAt least two QA CV leads with Lead Status Interested or Follow Up were created in the last 7 days.","steps":"1. On Leads, open New custom view and name it 'QA CV hot leads'.\n2. Add: Lead Status contains any of Interested, Follow Up · created date in the last 7 days · Owner = me; Save.\n3. Note the record count and three sample record names.\n4. Open the tab menu and choose Pin view.\n5. Open one of the listed leads, then click Back.\n6. Sign out via profile → Logout and sign in again.\n7. Open Leads and the view picker.","data":"View: 'QA CV hot leads'\nCriteria: Lead Status any of Interested/Follow Up AND last 7 days AND Owner = me\nCleanup: unpin and delete 'QA CV hot leads' and purge it from the Recycle Bin.","expected":"After Back and after signing in again, 'QA CV hot leads' is still open with the same count and records, its tab is shown, and it is listed under Pinned views.","actual":"ALT1 'QA CV hot leads' = (Lead Status Interested OR Follow Up) AND Created Time in the last 7 days (Owner = me left out: the QA CV seeds belong to the Owner account) - 13 records (QA CV L05…L11, L16 …). Pinned. Open QA CV L05, browser Back: same view, 13 records. Pinned views group lists 'QA CV hot leads' after signing in again. FAIL: after signing out (session ended, sign-in form shown) and signing in again, Leads opens on 'QA CV count' (16 records) instead of the working view 'QA CV hot leads' - the view opened by link/back is not kept as the last-used view across sign-in.","started":"2026-10-05T15:12:39Z","rows":[["View after sign-in","Last-used view","Another view","differs"],["Pinned group","Not checked live","QA CV hot leads still pinned","na"]],"att":[{"name":"E2E-1-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-E2E-1-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":227642},{"name":"E2E-1-after-signin.png","path":"browser-sessions/owner-112040-7855/screenshots/E2E-1-after-signin.png","kind":"TAVI screenshot","size":111053},{"name":"zoho-leads-last-view.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-leads-last-view.png","kind":"Zoho reference","size":123276}]},{"n":12,"key":"CV-012","id":"CVS-E09","title":"Deleted criteria field: no banner on the view's list page (only in the editor, by API name) while the view keeps filtering on the deleted field","caseTitle":"A view whose criteria field is deleted shows the deleted-field banner and still runs","area":"Related criteria","priority":"Medium","labels":["Bug","Custom Views","Related criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed leads QA CV L01…L12 exist (spec §1.2).\nOWNER has created the number field 'QA CV Temp Number' on Leads; L01 = 5, L02 = 0.","steps":"1. Open Leads → New custom view 'QA CV temp-field' with Name starts_with 'QA CV' and 'QA CV Temp Number' greater_than 1; Save; confirm L01 is returned.\n2. Delete the field 'QA CV Temp Number' from the Leads layout.\n3. Open 'QA CV temp-field' from the picker; record the banner and the result.\n4. Open its editor and record how the row is shown.\n5. Cross-check: apply Name starts with 'QA CV' in the Leads Filter panel, or call GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n6. Cleanup: delete 'QA CV temp-field' and purge it from the Recycle Bin; purge the deleted field if it is in the Recycle Bin.","data":"Field: 'QA CV Temp Number'\nL01 = 5 · L02 = 0","expected":"The banner \"Some fields in this view's criteria are deleted or hidden from you: QA CV Temp Number…\" is shown, the view still runs with no error, and the result is recorded and consistent with the cross-check.","actual":"OWNER created number field 'QA CV Temp Number' (qa_cv_temp_number); L01 = 5, L02 = 0. ALT1 view 'QA CV temp-field' (First name starts with 'QA CV' + QA CV Temp Number > 1) -> L01. OWNER deleted the field (204). The view still runs with no error and still returns only L01 (the stored criterion on the deleted field keeps filtering; Name-only filter gives 19 QA CV rows). FAIL: the list page shows no banner at all; only the editor shows 'Some fields in this view's criteria are deleted or hidden from you: qa_cv_temp_number.' - with the API name, not 'QA CV Temp Number' - and the row reads 'Select a field'. 2 console errors (403) on the page.","started":"2026-10-05T11:46:45Z","rows":[["Deleted field","Not checked live","List silent; editor names the field by API name","na"]],"att":[{"name":"E09-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-E09-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":156243},{"name":"E09-deleted-field-view.png","path":"browser-sessions/owner-112040-7855/screenshots/E09-deleted-field-view.png","kind":"TAVI screenshot","size":74105},{"name":"E09-deleted-field-editor.png","path":"browser-sessions/owner-112040-7855/screenshots/E09-deleted-field-editor.png","kind":"TAVI screenshot","size":99719}]},{"n":13,"key":"CV-013","id":"CVS-F01","title":"Manage Columns on a view with chosen columns offers no hidden/available fields, so a column (e.g. Comment) cannot be added","caseTitle":"Manage Columns shows and hides columns, keeps the record-name column locked, and resets","area":"Columns, sort & bulk","priority":"Medium","labels":["Bug","Custom Views","Columns, sort & bulk"],"pre":"Logged in as OWNER (Tenant Owner).\nSeed leads QA CV L01…L12 exist (spec §1.2).\nView 'QA CV columns' exists on Leads (Name starts_with 'QA CV'; columns Name, Lead Status, Company).","steps":"1. Open 'QA CV columns' → Manage Columns.\n2. Hide Lead Status and show Comment; apply.\n3. Try to untick the record-name column (Name).\n4. Use the reset option in Manage Columns.\n5. Cleanup: delete 'QA CV columns' and purge it from the Recycle Bin.","data":"Hide: Lead Status · Show: Comment\nLocked: Name","expected":"Lead Status disappears and Comment appears in the grid. Name cannot be unticked or hidden. Reset restores Name, Lead Status, Company.","actual":"Run as ALT1 on 'QA CV columns-f' (columns Full Name, Lead Status, Company). Manage Columns lists only VISIBLE (4): Full Name, Lead Status, Company, Lead Owner - no hidden/available list. Hiding Lead Status works (column disappears, banner 'You changed the columns for this view. Only you see this change.'). Full Name's Hide button is disabled (locked). There is no reset option inside Manage Columns; the banner's 'Use the view's columns' restores Full Name, Lead Status, Company. FAIL: Comment cannot be shown - Manage Columns offers no way to add a field that the view does not already show.","started":"2026-10-05T11:55:00Z","rows":[["Add a column","Tick any field","Not possible - only hide","gap"]],"att":[{"name":"F01-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-F01-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":246761},{"name":"F01-manage-columns-no-hidden-list.png","path":"browser-sessions/owner-112040-7855/screenshots/F01-manage-columns-no-hidden-list.png","kind":"TAVI screenshot","size":93466},{"name":"zoho-C09-manage-columns.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-C09-manage-columns.png","kind":"Zoho reference","size":262046}]},{"n":14,"key":"CV-014","id":"CVS-F03","title":"Manage Columns cannot add a column to a view (so a new column cannot be saved to the view)","caseTitle":"\"Save to view\" writes the owner's column change into the view and \"Use the view's columns\" removes an override","area":"Columns, sort & bulk","priority":"Medium","labels":["Bug","Custom Views","Columns, sort & bulk"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nOWNER owns 'QA CV save-cols' on Leads (columns Name, Lead Status, Company).","steps":"1. Open 'QA CV save-cols' → Manage Columns → add Comment; apply.\n2. Click \"Save to view\".\n3. GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views/{id} and read settings.columns and row_version.\n4. Manage Columns → hide Company; apply; then click \"Use the view's columns\".\n5. Read the grid and GET list-preferences.\n6. Cleanup: delete 'QA CV save-cols' and purge it from the Recycle Bin.","data":"Added then saved: Comment\nOverride then reset: hide Company","expected":"After \"Save to view\", settings.columns is Name, Lead Status, Company, Comment and row_version increases. After \"Use the view's columns\", the grid shows those four columns again and the override is gone from list-preferences.","actual":"Run as ALT1 on 'QA CV save-cols' (Full Name, Lead Status, Company). Step 1 (add Comment) cannot be done: Manage Columns does not offer Comment (same cause as F01). Tested the rest with a hide instead: hide Company -> banner with 'Save to view' and 'Use the view's columns'; Save to view -> settings.columns first_name, lead_status, owner and row_version 1 -> 2; then hide Lead Status -> 'Use the view's columns' restores the view's columns and the override is gone from list-preferences. Note: 'Save to view' also wrote the default Lead Owner column into the view.","started":"2026-10-05T12:35:02Z","rows":[["Add Comment and save to the view","Tick Comment, Save","Cannot add; hide + \"Save to view\" works","gap"]],"att":[{"name":"F03-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-F03-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":246473},{"name":"F01-manage-columns-no-hidden-list.png","path":"browser-sessions/owner-112040-7855/screenshots/F01-manage-columns-no-hidden-list.png","kind":"TAVI screenshot","size":93466},{"name":"zoho-C09-manage-columns.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-C09-manage-columns.png","kind":"Zoho reference","size":262046}]},{"n":15,"key":"CV-015","id":"CVS-F10","title":"Row selection is kept when switching to another view (bar still '3 selected')","caseTitle":"Switching view clears the row selection","area":"Columns, sort & bulk","priority":"Medium","labels":["Bug","Custom Views","Columns, sort & bulk"],"pre":"Logged in as OWNER (Tenant Owner).\nSeed leads QA CV L01…L12 exist (spec §1.2).\nView 'QA CV select' exists on Leads (Name starts_with 'QA CV').","steps":"1. Open 'QA CV select' and select 3 rows.\n2. Switch to All Leads; read the selection bar.\n3. Switch back to 'QA CV select' and check the rows.\n4. Cleanup: delete 'QA CV select' and purge it from the Recycle Bin.","data":"Selected: L01, L02, L03","expected":"The selection is cleared on switching: no rows are selected and the bar is gone in both views.","actual":"'QA CV select': L01, L02, L03 selected, bar '3 selected'. Switched to All Leads (URL ?view=All Leads, picker shows All Leads): L01, L02, L03 are still ticked and the bar still shows '3 selected'; switching back to 'QA CV select' - still 3 selected. FAIL: the selection is not cleared when the view changes (the earlier run on crm.taviportal.com cleared it).","started":"2026-10-05T12:02:00Z","rows":[["Selection after view switch","Cleared","Kept (3 selected)","differs"]],"att":[{"name":"F10-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-F10-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":276712},{"name":"F10-selection-kept-on-all-leads.png","path":"browser-sessions/owner-112040-7855/screenshots/F10-selection-kept-on-all-leads.png","kind":"TAVI screenshot","size":116603},{"name":"F10-zoho-after-switch.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/F10-zoho-after-switch.png","kind":"Zoho reference","size":190194}]},{"n":16,"key":"CV-016","id":"CVS-G04","title":"Clone in the picker row menu (dropdown layout) does nothing","caseTitle":"Cloning the same view twice never fails with a server error on the duplicate name","area":"Clone, pin & delete","priority":"Medium","labels":["Bug","Custom Views","Clone, pin & delete"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nOWNER owns 'QA CV clone-src' on Leads.","steps":"1. Open Leads and clone 'QA CV clone-src', keeping the suggested name, and save.\n2. Clone 'QA CV clone-src' again, keeping the suggested name.\n3. Try to save and read the result.\n4. Call POST /modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views/{v}/clone twice in a row and read both responses.\n5. Call GET /modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views?kind=list and list every view whose name starts with 'QA CV clone-src'.\n6. Cleanup: delete 'QA CV clone-src' and every clone of it and purge them from the Recycle Bin.","data":"Source: 'QA CV clone-src' · Clones made: 2 in the UI, 2 through the API","expected":"Each clone either gets a unique generated name or the user is prompted to rename it (\"You already have a view with this name.\"). No request returns a 500 or an unhandled VIEW_NAME_TAKEN error, and no two of OWNER's Leads views share a name.","actual":"API: POST …/clone twice -> 201 'Copy of QA CV clone-src' and 201 'Copy of QA CV clone-src (2)'. Tabs layout: Clone from the tab menu twice -> editor suggests 'Copy of QA CV clone-src (3)' / '(4)', saved with toasts. No 500, no VIEW_NAME_TAKEN, no duplicate names among ALT1's views. FAIL (reproduced from the 4 Oct run): in the dropdown layout, the view's 'Actions for QA CV clone-src' menu inside the picker offers Clone, but clicking it does nothing - no POST, no editor, no toast.","started":"2026-10-05T12:45:15Z","rows":[["Clone from the view menu","Clone opens the copy form","No request, no editor (Delete view in the same menu also does nothing)","differs"]],"att":[{"name":"G04-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-G04-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":276825},{"name":"G04-dropdown-clone-nothing.png","path":"browser-sessions/owner-112040-7855/screenshots/G04-dropdown-clone-nothing.png","kind":"TAVI screenshot","size":116791},{"name":"zoho-deals-tab-menu.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-deals-tab-menu.png","kind":"Zoho reference","size":213255}]},{"n":17,"key":"CV-017","id":"CVS-G06","title":"The 15-pinned-views limit is not enforced (16th pin accepted in UI and API)","caseTitle":"A 16th pin is refused because the limit is 15 pinned views","area":"Clone, pin & delete","priority":"Medium","labels":["Bug","Custom Views","Clone, pin & delete"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nOWNER has exactly 15 pinned Leads views (pin 'QA CV pin-01'…'QA CV pin-15' as needed and record any pins that existed before).\nOWNER owns 'QA CV pin-16' on Leads (not pinned).","steps":"1. Open Leads and open the tab menu on 'QA CV pin-16'.\n2. Choose Pin view and read the message.\n3. Open the picker and count the views under Pinned views.\n4. Call PUT /modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views/{QA CV pin-16 id}/pin and read the response.\n5. Call GET /modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views?kind=list and count views with pinned = true.\n6. Cleanup: unpin the views pinned for this test; delete 'QA CV pin-01'…'QA CV pin-16' and purge them from the Recycle Bin.","data":"Pinned: 15 · 16th view: 'QA CV pin-16' · Limit: 15","expected":"The 16th pin is refused in the UI with a message stating the limit of 15, and the API returns a 4xx error (no 500). Pinned views still holds exactly 15 views and 'QA CV pin-16' is not pinned.","actual":"ALT1 had 0 pins; pinned QA CV pin-01…pin-15 (15 pinned). Tab menu on 'QA CV pin-16': Pin view enabled; clicking it pins the view with no message (16 pinned). PUT …/views/{pin-16}/pin -> 204. GET: 16 pinned, pin-16 pinned=true; Pinned views group lists 16. Expected a refusal stating the 15 limit and a 4xx. All pins removed afterwards.","started":"2026-10-05T12:46:14Z","rows":[["16th pin","Not checked live (needs 15 pins in Zoho)","Accepted in UI and API (204), no message","na"]],"att":[{"name":"G06-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-G06-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":125610},{"name":"G06-16th-pin.png","path":"browser-sessions/owner-112040-7855/screenshots/G06-16th-pin.png","kind":"TAVI screenshot","size":110079}]},{"n":18,"key":"CV-018","id":"CVS-H14","title":"Records whose value is beyond the 75-column cap vanish from the Kanban board; board-summary says truncated=false","caseTitle":"A board on a pick list with more than 75 values shows the column cap notice","area":"Kanban setup","priority":"Medium","labels":["Bug","Custom Views","Kanban setup"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nPick list field 'QA CV Picklist80' with 80 values exists on Leads (OWNER adds it for this test).\nQA CV L01 is set to value 76 and QA CV L02 to value 80.","steps":"1. Create Kanban view 'QA CV kb-80' on Leads with Categorize by: 'QA CV Picklist80'.\n2. Open the board and read the notice.\n3. Count the columns.\n4. Search the board for QA CV L01 and QA CV L02.\n5. Call GET /modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records/board-summary?group_by=\u003cQA CV Picklist80>&view_id=\u003cv> and read truncated.\n6. Cleanup: delete 'QA CV kb-80' and purge it from the Recycle Bin; clear the field on QA CV L01 and L02 and delete 'QA CV Picklist80'.","data":"Pick list values: 80 · Cap: 75 · Records beyond the cap: QA CV L01 (value 76), QA CV L02 (value 80)","expected":"The notice \"Only the first 75 values are shown as columns.\" is shown and the board has 75 value columns plus Unaccounted. Behaviour is consistent and documented: record where QA CV L01 and L02 appear (PRD P1-7 wants an \"Other values\" column) and the truncated flag from board-summary.","actual":"Field 'QA CV Picklist80' (v01…v80) created on Leads; QA CV L01 = v76, QA CV L02 = v80. Kanban 'QA CV kb-80': notice 'Only the first 75 values are shown as columns.'; 75 value columns v01–v75 + Unaccounted (76). FAIL (reproduced from 4 Oct): L01 and L02 appear nowhere on the board - no v76/v80 column, not in Unaccounted, no 'Other values' column (PRD P1-7). board-summary returns columns v76 count 1 and v80 count 1 but truncated=false.","started":"2026-10-05T13:35:00Z","rows":[["Records past the cap","Not checked live","Not shown anywhere; board-summary says truncated=false","na"]],"att":[{"name":"H14-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-H14-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":97355},{"name":"H14-board-80.png","path":"browser-sessions/owner-112040-7855/screenshots/H14-board-80.png","kind":"TAVI screenshot","size":74114}]},{"n":19,"key":"CV-019","id":"CVS-I04","title":"A record holding a removed pick-list value is shown in an unmarked extra column - no 'no longer an option' flag","caseTitle":"A record holding a value removed from the pick list is flagged on the board","area":"Kanban board","priority":"Medium","labels":["Bug","Custom Views","Kanban board"],"pre":"Logged in as OWNER (Tenant Owner).\nKanban view 'QA CV kb-status' exists on Leads (Categorize by: Lead Status).\nOWNER adds the option 'QA CV stale' to Lead Status, sets QA CV L05 to it, then removes the option.","steps":"1. Open 'QA CV kb-status'.\n2. Find QA CV L05 on the board.\n3. Read the column and message shown for it.\n4. Open QA CV L05 and read Lead Status.\n5. Cleanup: move the record back to its original value.","data":"Record: QA CV L05 · Removed value: 'QA CV stale'","expected":"QA CV L05 is still shown on the board, marked with \"This value is no longer an option of the field\".","actual":"QA CV L12 holds 'QA CV Temp', a value added to Lead Status and then removed earlier in this run. Board 'QA CV kb-status': L12 is still shown, in an extra column 'QA CV Temp' (count 1) placed before Unaccounted. FAIL (reproduced from 4 Oct): no 'This value is no longer an option of the field' marker anywhere - not in text, title, aria-label or a tooltip on the column header or the card; the stale column looks like any normal value column and offers 'Create Lead'.","started":"2026-10-05T13:53:00Z","rows":[["Stale value flagged","Not checked live","No flag","na"]],"att":[{"name":"I04-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-I04-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":114941},{"name":"I04-stale-value.png","path":"browser-sessions/owner-112040-7855/screenshots/I04-stale-value.png","kind":"TAVI screenshot","size":108837}]},{"n":20,"key":"CV-020","id":"CVS-I05","title":"Deals Kanban by Stage has no pipeline picker, ignores the pipeline's stages and shows no stage probability","caseTitle":"A Deals board by Stage shows the pipeline picker and each stage's probability","area":"Kanban board","priority":"Medium","labels":["Bug","Custom Views","Kanban board"],"pre":"Logged in as OWNER (Tenant Owner).\nKanban view 'QA CV deals-by-stage' exists on Deals (Categorize by: Stage · Aggregate by: Amount).\nSeed records QA CV D01…D08 exist on Deals (spec §1.2).","steps":"1. Open 'QA CV deals-by-stage'.\n2. Find the pipeline picker and note the pipelines offered.\n3. Choose each pipeline in turn and read the columns.\n4. Read the probability on each stage header.\n5. Compare each probability with the pipeline's stage settings.","data":"View: 'QA CV deals-by-stage' · Pipelines: every pipeline on Deals","expected":"The pipeline picker is shown and the columns change to the chosen pipeline's stages. Each stage header shows \"Probability N%\" matching the configured value.","actual":"Deals Standard layout has one pipeline 'Standard' (qualification, needs_analysis, proposal, negotiation, closed_won, closed_lost); the Test layout has two ('Standard Pipeline', 'Test-Pipeline copy'). Board 'QA CV deals-by-stage' (Standard) and 'QA CV deals-test-layout' (Test): no pipeline picker on either board (only the Layout picker); both show all 11 Stage pick-list values (test-01, test-02, qualification … closed_lost_to_competition) instead of the chosen pipeline's stages; no stage header shows 'Probability N%' (the pipeline API carries no probability). Column titles show raw stage keys (needs_analysis, closed_won).","started":"2026-10-05T13:56:00Z","rows":[["Stage headers","Stage name + probability (10%, 20%, 40%)","Raw keys (needs_analysis), no probability","differs"],["Pipeline picker","Not checked live (one pipeline in the Zoho org)","None, even with 2 pipelines","na"]],"att":[{"name":"I05-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-I05-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":186334},{"name":"I05-deals-board.png","path":"browser-sessions/owner-112040-7855/screenshots/I05-deals-board.png","kind":"TAVI screenshot","size":80996},{"name":"I05-zoho-deals-kanban.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/I05-zoho-deals-kanban.png","kind":"Zoho reference","size":138526}]},{"n":21,"key":"CV-021","id":"CVS-I09","title":"Dropping a deal on Closed Won/Lost opens no closing dialog - the move just fails with 'Closing Date is required'","caseTitle":"Dragging a deal to Closed Won or Closed Lost opens the closing dialog and enforces its mandatory fields","area":"Kanban board","priority":"Medium","labels":["Bug","Custom Views","Kanban board"],"pre":"Logged in as OWNER (Tenant Owner).\nNo active workflow rule on the target field sends email (check GET /workflow/rules).\nKanban view 'QA CV deals-by-stage' exists on Deals (Categorize by: Stage · Aggregate by: Amount).\nQA CV D03 is in Negotiation.","steps":"1. Open 'QA CV deals-by-stage'.\n2. Drag QA CV D03 from Negotiation to Closed Lost.\n3. Leave the mandatory fields empty and try to confirm.\n4. Cancel the dialog and check where the card is.\n5. Drag again, fill the mandatory fields and confirm.\n6. Open QA CV D03 and read Stage.\n7. Cleanup: move the record back to its original value.","data":"Record: QA CV D03 · From: Negotiation · To: Closed Lost (repeat for Closed Won)","expected":"A closing dialog opens. It cannot be confirmed while mandatory fields are empty. Cancelling returns the card with nothing saved; completing the fields saves Stage Closed Lost.","actual":"QA CV D03 (negotiation) moved to closed_lost on the board: no closing dialog opens; a PATCH is sent and refused - toast 'Closing Date is required to close a deal.'; the card returns to negotiation and Stage is unchanged. Same for closed_won. The user is never offered a dialog to fill the mandatory closing fields, so a deal cannot be closed from the board at all.","started":"2026-10-05T14:05:00Z","rows":[["Closing dialog","Not checked live (would change a Zoho deal)","None - move refused with \"Closing Date is required\"","na"]],"att":[{"name":"I09-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-I09-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":107643},{"name":"I09-no-closing-dialog.png","path":"browser-sessions/owner-112040-7855/screenshots/I09-no-closing-dialog.png","kind":"TAVI screenshot","size":92805}]},{"n":22,"key":"CV-022","id":"CVS-I11","title":"Kanban move from a stale board overwrites a newer change with no conflict check","caseTitle":"Two sessions moving the same card never lose an update","area":"Kanban board","priority":"Medium","labels":["Bug","Custom Views","Kanban board","Concurrency"],"pre":"Logged in as OWNER (Tenant Owner).\nSecond session: Logged in as OWNER (Tenant Owner). (another browser profile).\nNo active workflow rule on the target field sends email (check GET /workflow/rules).\nKanban view 'QA CV kb-status' exists on Leads (Categorize by: Lead Status).\nQA CV L06 has Lead Status Interested.","steps":"1. Open 'QA CV kb-status' in both sessions.\n2. In session A, drag QA CV L06 from Interested to Follow Up.\n3. In session B, without refreshing, drag QA CV L06 from Interested to the next column after Follow Up.\n4. Read session B's result.\n5. Open QA CV L06 and read Lead Status and its history.\n6. Cleanup: move the record back to its original value.","data":"Record: QA CV L06 · Session A: Interested → Follow Up · Session B: stale move","expected":"Session B gets a conflict or the board refreshes to the latest state with a message (e.g. \"Could not move the record.\"). The record ends in one consistent state and every saved move appears in its history.","actual":"Two tabs (same user, separate pages) on 'QA CV kb-status'. Tab A: QA CV L06 Interested -> Follow Up (saved). Tab B, not refreshed (still showing L06 in Interested): moved L06 to WhatsApp Follow Up -> PATCH accepted, 'Record updated successfully'. Final Lead Status WhatsApp Follow Up; audit shows Interested->Follow Up then Follow Up->WhatsApp Follow Up. No conflict, no 'Could not move the record' and no board refresh in tab B - the stale move silently overwrote A's change (the PATCH carries no version check). L06 restored to Interested.","started":"2026-10-05T14:20:30Z","rows":[["Concurrent card moves","Not checked live","Last write wins, no message","na"]],"att":[{"name":"I11-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-I11-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":107619},{"name":"I11-session-b.png","path":"browser-sessions/owner-112040-7855/screenshots/I11-session-b.png","kind":"TAVI screenshot","size":94188}]},{"n":23,"key":"CV-023","id":"CVS-C02","title":"View name validation messages are never shown: empty/space-only names just disable Save, and a 121-character name is silently cut to 120","caseTitle":"The view name is validated and every accepted name is shown as plain text","area":"Create / edit view","priority":"Low","labels":["Bug","Custom Views","Create / edit view"],"pre":"Logged in as OWNER (Tenant Owner).\nLeads holds 'QA CV name' (for D7).","steps":"1. Click New custom view.\n2. Enter the first name from Test Data and click Save.\n3. Record the message or the saved name (GET the view).\n4. Repeat for every name in Test Data.\n5. Open the picker, the tab, the Manage custom views page and the delete dialog for the D11 view.","data":"D1: '' (empty)\nD2: '   ' (spaces only)\nD3: 'Q'\nD4: 'QA CV ' + 114 × 'x' (120 chars)\nD5: 'QA CV ' + 115 × 'x' (121 chars)\nD6: '  QA CV trim  '\nD7: 'qa cv NAME' (vs existing 'QA CV name')\nD8: 'QA CV عملاء القاهرة'\nD9: 'QA CV عملاء Cairo' + U+200F\nD10: 'QA CV 🚀😀𝒳'\nD11: 'QA CV \u003cimg src=x onerror=alert(1)>'\nD14: 'QA CV zero' + U+200B + 'width' + U+0007","expected":"D1 and D2 are blocked with \"Enter a name for the view.\" D5 is blocked with \"A view name can be at most 120 characters.\" D3, D4, D8, D9 and D10 save and display exactly as typed. D11 is shown as literal text in the picker, tab, Manage page and delete dialog, and no script runs. Behaviour is consistent and documented: whether D6 is stored trimmed, whether D7 is accepted or refused as a duplicate, and whether D14's zero-width and control characters are stripped, rejected or kept. Cleanup: delete every view created (including 'Q' and 'QA CV name') and purge them from the Recycle Bin.","actual":"D1 '' and D2 '   ': Save is disabled and 'Enter a name for the view.' is never shown. D5 (121 chars): the input stops at 120 characters, so 'A view name can be at most 120 characters.' never appears (the truncated name then hit 409 VIEW_NAME_TAKEN against the D4 view). D3 'Q', D4 (120), D8 Arabic, D9 (RLM kept), D10 emoji saved exactly as typed. D6 stored trimmed ('QA CV trim'). D7 'qa cv NAME' refused as a duplicate of 'QA CV name' (409, names are case-insensitive). D14 zero-width space and U+0007 kept as typed. D11 '\u003cimg src=x onerror=alert(1)>' shown as literal text in the tab, picker, Manage page and delete dialog; no \u003cimg> element, no script ran.","started":"2026-10-05T09:29:32Z","rows":[["Empty / blank name","\"Custom view name cannot be empty.\" under the field","Save disabled, no text (\"Enter a name for the view.\" never shown)","differs"],["121-character name","Not checked live","Input stops at 120; \"at most 120 characters\" never shown","na"]],"att":[{"name":"C02-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-C02-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":190839},{"name":"C02-empty-name-no-message.png","path":"browser-sessions/owner-112040-7855/screenshots/C02-empty-name-no-message.png","kind":"TAVI screenshot","size":87932},{"name":"zoho-C02-empty-name-save.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-C02-empty-name-save.png","kind":"Zoho reference","size":147685}]},{"n":24,"key":"CV-024","id":"CVS-C09","title":"A view's grid shows two columns that were not chosen (Tags and Source are always appended)","caseTitle":"The grid shows exactly the chosen columns in the chosen order","area":"Create / edit view","priority":"Low","labels":["Bug","Custom Views","Create / edit view"],"pre":"Logged in as OWNER (Tenant Owner).","steps":"1. Click New custom view and enter the name.\n2. Choose the eight columns in Test Data.\n3. Reorder them to the order in Test Data.\n4. Click Save and open the view.","data":"Name: 'QA CV columns'\nColumns: Lead Name, Lead Status, Company, Email, Phone, Lead Owner, Created Time, Modified Time","expected":"The grid shows exactly those eight columns in exactly that order. Cleanup: delete 'QA CV columns' and purge it from the Recycle Bin.","actual":"Run as ALT1. Editor (Standard layout): added Full Name, Lead Status, Company, Email, Phone, Lead Owner, Created At, Last Activity in that order ('Modified Time' is not offered; Last Activity = last_modified_at). Saved (201); stored columns in exactly that order. Grid after selecting the view: Full Name, Lead Status, Company, Email, Phone, Lead Owner, Created At, Last Activity - order correct - but two unchosen columns, Tags and Source, are appended.","started":"2026-10-05T10:04:42Z","rows":[["Grid columns","Only the view's chosen columns","Chosen columns + Tags + Source always appended","differs"]],"att":[{"name":"C09-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-C09-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":272976},{"name":"C09-grid-columns.png","path":"browser-sessions/owner-112040-7855/screenshots/C09-grid-columns.png","kind":"TAVI screenshot","size":112837},{"name":"zoho-C09-list-columns.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/zoho-C09-list-columns.png","kind":"Zoho reference","size":150080}]},{"n":25,"key":"CV-025","id":"CVS-C12","title":"Page size 200 is accepted by the server but cannot be chosen in the editor; with 200 stored the editor shows 'Select…' and the grid's Rows per page reads 10","caseTitle":"Sort and page size are applied and out-of-range page sizes are refused","area":"Create / edit view","priority":"Low","labels":["Bug","Custom Views","Create / edit view"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.","steps":"1. Create a view sorted by Created Time descending with page size 10; open it.\n2. Edit it to page size 200; open it.\n3. Edit it to \"Each person's usual\"; open it.\n4. Send PATCH /api/v1/modules/{m}/views/{v} with page_size 9.\n5. Send PATCH with page_size 201.","data":"Name: 'QA CV sort-page'\nSort: Created Time DESC\nPage sizes: 10, 200, Each person's usual, 9 (API), 201 (API)","expected":"The grid is sorted by Created Time descending and shows 10, then 200 rows per page, then the viewer's usual page size. The PATCHes with 9 and 201 are rejected and the stored page size is unchanged. Cleanup: delete 'QA CV sort-page' and purge it from the Recycle Bin.","actual":"Works: 'QA CV sort-page' sorted Created At descending (header 'Created At ↓') with page size 10; PATCH page_size 9 and 201 -> 422 'Page size must be a whole number between 10 and 200.', stored value unchanged. FAIL: the editor offers only Each person's usual page size / 10 / 25 / 50 / 100 - 200 cannot be chosen although the server accepts it (PATCH 200 -> 200). With 200 stored, the editor shows 'Select…' and the grid shows 1–101 of 101 rows while its Rows per page control reads 10.","started":"2026-10-05T09:14:26Z","rows":[["Page sizes","10 / 20 / 30 / 40 / 50 / 100 / 200 in the list (no per-view setting)","10 / 25 / 50 / 100 in the editor; a stored 200 shows \"Select…\"","differs"]],"att":[{"name":"C12-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-C12-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":239445},{"name":"C12-editor-page-size-options.png","path":"browser-sessions/owner-112040-7855/screenshots/C12-editor-page-size-options.png","kind":"TAVI screenshot","size":94571},{"name":"C12-zoho-records-per-page.png","path":"browser-sessions/owner-112040-7855/screenshots/zoho/C12-zoho-records-per-page.png","kind":"Zoho reference","size":210576},{"name":"C12-grid-page-size-200.png","path":"browser-sessions/owner-112040-7855/screenshots/C12-grid-page-size-200.png","kind":"TAVI screenshot","size":119746}]},{"n":26,"key":"CV-026","id":"CVS-D14","title":"A pick list value removed from the field is not shown in the view editor (blank 'Value', no warning), although the view still filters on it","caseTitle":"Picklist operators split records correctly and a value later removed from the picklist does not crash the view","area":"Criteria","priority":"Low","labels":["Bug","Custom Views","Criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.\nSeed leads QA CV L01…L12 exist (spec §1.2).\nS1 and S2 are two Lead Status values; one seed lead has an empty status.","steps":"1. Open Leads → New custom view 'QA CV picklist' with Name starts_with 'QA CV' and Lead Status equals S1; Save; then edit to not_equal_to S1, contains_any_of S1,S2 and contains_none_of S1,S2; record each result.\n2. In the Leads layout, add the pick list value 'QA CV Temp' to Lead Status and set L12 to it.\n3. Edit the view to Lead Status equals 'QA CV Temp'; Save; confirm L12 is returned.\n4. Remove 'QA CV Temp' from the Lead Status pick list.\n5. Reopen the view and its editor; record the result and how the stale value is shown.\n6. Cross-check: apply the same Lead Status condition in the Leads Filter panel, or call GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/records?filters=\u003csame condition>, and compare the total with the grid's record count.\n7. Cleanup: restore L12's status; delete 'QA CV picklist' and purge it from the Recycle Bin.","data":"S1 = status of L01 · S2 = status of L02\nTemporary value: 'QA CV Temp' (on L12)\nLead with empty status: from the seed set","expected":"equals S1 → only S1 leads; not_equal_to S1 → the rest (empty status handled as the module filter does); contains_any_of → S1 and S2 leads; contains_none_of → the rest. After the value is removed the view opens with no crash or error, the stale value is shown in the editor, and the results are consistent with the module filter (record them).","actual":"S1 = No Answer, S2 = Busy. equals S1 -> L01, L15; not_equal_to S1 -> the rest incl. empty-status L12; contains_any_of S1,S2 -> L01, L02, L13, L14, L15; contains_none_of -> the rest (all equal the module filter). OWNER added 'QA CV Temp' to Lead Status and set L12 to it; view equals 'QA CV Temp' -> L12. OWNER removed the value again (back to 16 values). Reopened: the grid works and still returns L12 showing 'QA CV Temp', no crash. FAIL: the editor shows the row as 'Lead Status | Equals | Value' - the stored value is not shown (a normal value such as 'No Answer' is shown) and there is no notice that it is no longer an option. Also 2 console errors (403) when ALT1 opens the editor.","started":"2026-10-05T11:22:38Z","rows":[["Saved value shown when editing","The value appears in the criteria row","Blank \"Value\" - user cannot see what the view filters on","differs"]],"att":[{"name":"D14-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D14-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":191422},{"name":"D14-editor-stale-value.png","path":"browser-sessions/owner-112040-7855/screenshots/D Comment is not empty (+ Full Name starts with 'QA CV P' to isolate P01-P04). Pattern typed '1 or 2 and 3 and 4'. The help ('read from left to right') is present as a tooltip on the pattern help icon. Results P02, P03 - correct for ((1 or 2) and 3); P01 and P04 not returned. FAIL: the saved pattern is stored and reopened exactly as typed ('( 1 or 2 and 3 and 4 )'), not fully bracketed as ((1 or 2) and 3).","started":"2026-10-05T10:42:30Z","rows":[["Pattern canonical form","Not checked live","Stored/shown without brackets, so precedence is ambiguous","na"]],"att":[{"name":"D21-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D21-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":114132},{"name":"D21-precedence-editor.png","path":"browser-sessions/owner-112040-7855/screenshots/D21-precedence-editor.png","kind":"TAVI screenshot","size":97513}]},{"n":28,"key":"CV-028","id":"CVS-D22","title":"Upper-case 'AND' pattern is accepted by the editor and the API (case expects it to be rejected)","caseTitle":"Every invalid criteria pattern is blocked in the editor and rejected by the API","area":"Criteria","priority":"Low","labels":["Bug","Custom Views","Criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAPI: bearer token captured from the signed-in session; headers x-tenant-id and x-app-key: crm.","steps":"1. Open Leads → New custom view 'QA CV bad-pattern' and add three rows (Name starts_with 'QA CV', Lead Status is_not_empty, Comment is_empty).\n2. Enter each 3-row pattern in Test Data; click Save; record the message.\n3. Add rows to 5 for the depth-4 pattern and to 25 for the 201-character pattern; Save each and record the message.\n4. POST /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views with each pattern and record the status code.\n5. GET /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views?kind=list and confirm no 'QA CV bad-pattern' exists.\n6. Click Cancel.","data":"Unbalanced: '(1 and 2 or 3'\nEmpty group: '()'\nBare operator: '(and)'\nTrailing operator: '1 and'\nMissing operator: '1 2'\nMissing row: '1 and 5'\nUnused row: '1 and 2' (row 3 unused)\nRow used twice: '1 and 1 and 2 and 3'\nUnknown word: '1 xor 2 and 3'\nUpper case: '1 AND 2 AND 3'\n201 chars (25 rows): '(1) and (2) and … (20) and 21 and 22 and 23 and 24 and 25'\nDepth 4 (5 rows): '((((1 and 2) or 3) and 4) or 5)'","expected":"For every pattern the editor shows \"Fix the criteria pattern: every row number must appear once, and brackets must match.\" (or a more specific message) and Save is blocked. The API rejects every pattern with 400/422. No view is created.","actual":"Editor: every invalid pattern disables the pattern Save and shows a specific message (e.g. 'Brackets are not balanced.'); the view Save is paused while the pattern is edited. API: every invalid pattern -> 422 with a specific message (unbalanced, unexpected ')', two operators, ends unexpectedly, criteria 5 does not exist, criteria 3 missing, criteria 1 used twice, unknown word xor, nests deeper than 3 levels, at most 200 characters). FAIL: the upper-case pattern '1 AND 2 AND 3' is accepted by the editor and by the API (201), although the case lists it as invalid.","started":"2026-10-05T10:44:56Z","rows":[["Keyword case","Not checked live","Upper-case keywords accepted and saved","na"]],"att":[{"name":"D22-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-D22-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":115863},{"name":"D22-uppercase-accepted.png","path":"browser-sessions/owner-112040-7855/screenshots/D22-uppercase-accepted.png","kind":"TAVI screenshot","size":99904}]},{"n":29,"key":"CV-029","id":"CVS-E07","title":"Module with no related modules: the editor still shows an empty related block and an enabled 'Add condition'","caseTitle":"A module that no other module looks up shows \"No module has a lookup to {{module}} yet.\"","area":"Related criteria","priority":"Low","labels":["Bug","Custom Views","Related criteria"],"pre":"Logged in as OWNER (Tenant Owner).\nAP A CV ov-NN' via POST /api/v1/modules/841043e1-c078-41f9-8d6e-dfd61bee45c3/views to make up the number.\n3. Apply a column override to each of the 51 views in order (Manage Columns or PUT list-preferences).\n4. GET list-preferences; count the overrides and note which view lost or never got one.\n5. Cleanup: PUT the saved list-preferences back; delete every 'QA CV ov-' view and purge it from the Recycle Bin.","data":"Overrides: 51 (limit 50)\nOverride: hide one column per view","expected":"Behaviour is consistent and documented: either the oldest override (view 1) is dropped and 50 remain, or the 51st is rejected with 4xx. No 500, and the other 50 overrides are intact.","actual":"As ALT1: 51 Leads list views (incl. 'QA CV ov-NN'); PUT list-preferences with a column override for each of the 51 -> 200; GET shows all 51 stored (first and last both kept) - neither the oldest dropped nor the 51st rejected; the 50-override limit is not enforced. ALT1's preferences restored afterwards (PUT 200).","started":"2026-10-05T12:35:29Z","rows":[["51st override","Not checked live","Stored (51 kept), no limit enforced","na"]],"att":[{"name":"F04-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-F04-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":54396},{"name":"F04-api-51-overrides.png","path":"browser-sessions/owner-112040-7855/screenshots/F04-api-51-overrides.png","kind":"TAVI screenshot","size":18954}]},{"n":31,"key":"CV-031","id":"CVS-F06","title":"Toolbar sort label shows API names ('Sort: amount desc') instead of the field label and direction","caseTitle":"The toolbar sort control gives the same result as header sort and shows \"Sort: field dir\"","area":"Columns, sort & bulk","priority":"Low","labels":["Bug","Custom Views","Columns, sort & bulk"],"pre":"Logged in as OWNER (Tenant Owner).\nSeed deals QA CV D01…D08 exist with Amount, in order: 0, 9999.99, 10000, 10000.01, empty, -1 (if negative is allowed), 15000, 1000000000 (spec §1.2).\nView 'QA CV sort-deals' exists n the tenant). All Leads (128 records): p95 9125 ms, median 4122, min 2851, max 10116. All Deals (50 records): p95 3300 ms, median 2585, min 1945, max 3696. Target p95 \u003c= 1.5 s missed on both (4 Oct: Leads p95 6826, Deals 3885).","started":"2026-10-05T15:04:12Z","rows":[["p95","Not measured","Leads 9.1 s, Deals 3.3 s","na"]],"att":[{"name":"L08-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-L08-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":87509},{"name":"L08-L09-timings.png","path":"browser-sessions/owner-112040-7855/screenshots/L08-L09-timings.png","kind":"TAVI screenshot","size":24912}]},{"n":43,"key":"CV-043","id":"CVS-L09","title":"Kanban headers + first cards p95 5.1 s (target 2 s)","caseTitle":"Kanban column headers and first cards render within 2 s at p95","area":"i18n, a11y & performance","priority":"Low","labels":["Bug","Custom Views","i18n, a11y & performance","Performance"],"pre":"Logged in as OWNER (Tenant Owner).\nRun alone — no other session signed in to the account.\nDeals Kanban view 'QA CV perf-board' by Stage with Amount aggregate exists.\nDevTools Network tab open with cache disabled.","steps":"1. Open 'QA CV perf-board' and reload it 20 times.\n2. For each load, record the time until every column header (count and sum) and the first cards are shown.\n3. Compute the p95.","data":"Loads: 20\nTarget: p95 ≤ 2 s\nCleanup: delete 'QA CV perf-board' and purge it from the Recycle Bin.","expected":"The 95th-percentile time to headers and first cards is within 2 seconds.","actual":"Deals Kanban 'QA CV deals-by-stage' (Stage, Amount; 12 columns), 20 reloads until all column headers with Amount totals and at least one card are shown: p95 5100 ms, median 2290, min 1261, max 26045. Target 2 s p95 missed.","started":"2026-10-05T15:07:06Z","rows":[["p95","Not measured","5.1 s (max 26 s)","na"]],"att":[{"name":"L09-vs-zoho.png","path":"bugs/screenshots/owner-112040-7855-L09-vs-zoho.png","kind":"Annotated TAVI vs Zoho","size":83530},{"name":"L const PC={High:'var(--high)',Medium:'var(--medium)',Low:'var(--low)'};
const LC={Bug:'#ef4444','Custom Views':'#3f76ff',Security:'#dc2626',Accessibility:'#8b5cf6','RTL / Arabic':'#0ea5e9',Performance:'#f59e0b',API:'#14b8a6',Concurrency:'#ec4899'};

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const priIcon=p=>'<span class="pri" title="'+p+' priority" style="color:'+PC[p]+'"><svg viewBox="0 0 16 16" fill="currentColor">'+(p==='High'?'<rect x="2" y="9" width="3" height="5" rx="1"/><rect x="6.5" y="5" width="3" height="9" rx="1"/><rect x="11" y="1" width="3" height="13" rx="1"/>':p==='Medium'?'<rect x="2" y="9" width="3" height="5" rx="1"/><rect x="6.5" y="5" width="3" height="9" rx="1"/><rect x="11" y="1" width="3" height="13" rx="1" opacity=".25"/>':'<rect x="2" y="9" width="3" height="5" rx="1"/><rect x="6.5" y="5" width="3" height="9" rx="1" opacity=".25"/><rect x="11" y="1" width="3" height="13" rx="1" opacity=".25"/>')+'</svg></span>';
const areas=[...new Set(B.map(b=>b.area))];document.getElementById('fa').innerHTML+=areas.map(a=>'<option>'+esc(a)+'</option>').join('');

const lines=s=>s.split('\n').map(l=>l.trim()).filter(Boolean);
const olist=s=>{const L=lines(s);return L.every(l=>/^\d+\./.test(l))?'<ol>'+L.map(l=>'<li>'+esc(l.replace(/^\d+\.\s*/,''))+'</li>').join('')+'</ol>':'<ul>'+L.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>'};
function filtered(){const q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('fp').value,a=document.getElementById('fa').value;return B.filter(b=>(!p||b.priority===p)&&(!a||b.area===a)&&(!q||(b.key+' '+b.id+' '+b.title+' '+b.actual).toLowerCase().includes(q)))}
function renderList(){const F=filtered();const L=document.getElementById('list');if(!F.length){L.innerHTML='<div class="empty">No work items match.</div>';return}
 let h='';for(const p of ['High','Medium','Low']){const g=F.filter(b=>b.priority===p);if(!g.length)continue;h+='<div class="grp">'+priIcon(p)+p+' <span class="chip">'+g.length+'</span></div>';
 for(const b of g)h+='<div class="row'+(b.key===cur?' on':'')+'" data-k="'+b.key+'" tabindex="0">'+priIcon(b.priority)+'<span class="key">'+b.key+'</span><div><div class="rt">'+esc(b.title)+'</div><div class="rm"><span class="state"><span class="dot"></span>Backlog</span><span class="chip">'+esc(b.id)+'</span><span class="chip">'+esc(b.area)+'</span><span class="chip">📎 '+b.att.length+'</span></div></div></div>'}
