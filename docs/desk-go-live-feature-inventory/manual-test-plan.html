<title>Desk Manual Test Sheet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky toolbar (progress + filters) over a single reading column of feature sheets; each sheet = header strip + case rows with an inline result control. Guide sections live in a second tab. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9eeec; --fg:#17201d; --muted:#5d6b66; --line:#d5dedb;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --pass:#1f7a4d; --pass-bg:#e2f3ea; --fail:#b3261e; --fail-bg:#fbe7e5; --blk:#9a5b00; --blk-bg:#fbf0dc; --nb:#5b4f9c; --nb-bg:#ecebf8; --nr:#7a8682;
  --p0:#b3261e; --p1:#c26a00; --p2:#1f5f8b; --p3:#5d6b66;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201d; --sunk:#1f2825; --fg:#e3ebe8; --muted:#9aaba5; --line:#2c3834;
  --accent:#6fb0dd; --accent-soft:#1c2c38;
  --pass:#5fcf95; --pass-bg:#16301f; --fail:#ff8a80; --fail-bg:#3a1c1a; --blk:#f0b45a; --blk-bg:#352812; --nb:#b3a8f0; --nb-bg:#26233d; --nr:#7f8e89;
  --p0:#ff8a80; --p1:#f0b45a; --p2:#6fb0dd; --p3:#9aaba5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201d; --sunk:#1f2825; --fg:#e3ebe8; --muted:#9aaba5; --line:#2c3834;
  --accent:#6fb0dd; --accent-soft:#1c2c38;
  --pass:#5fcf95; --pass-bg:#16301f; --fail:#ff8a80; --fail-bg:#3a1c1a; --blk:#f0b45a; --blk-bg:#352812; --nb:#b3a8f0; --nb-bg:#26233d; --nr:#7f8e89;
  --p0:#ff8a80; --p1:#f0b45a; --p2:#6fb0dd; --p3:#9aaba5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:24px 8px;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;max-width:90ch}
.sub code,code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tabs{display:flex;gap:4px}
.tab{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.prog{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.track{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.track span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.save{font-size:12px;color:var(--muted)}
.save.warn{color:var(--blk)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=search]{font:14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=search]{width:220px;max-width:100%}
.chip{font:600 12.5px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 12.5px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 10px;border-radius:6px;cursor:pointer}
main{padding-block:18px 64px;display:flex;flex-direction:column;gap:14px}
.area-h{font-family:var(--f-display);font-weight:700;font-size:15px;margin:14px 0 0;display:flex;gap:8px;align-items:center;color:var(--muted)}
.prio{font:700 11px var(--f-mono);padding:2px 6px;border-radius:4px;color:var(--surface)}
.prio.P0{background:var(--p0)}.prio.P1{background:var(--p1)}.prio.P2{background:var(--p2)}.prio.P3{background:var(--p3)}
details.feat{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.feat>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
details.feat>summary::-webkit-details-marker{display:none}
.fid{font:600 13px var(--f-mono);color:var(--accent)}
.fname{font-weight:600;min-width:0}
.fname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fstat{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;width:90px;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.mini span{height:100%}
.fbody{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.fmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px;font-size:13.5px}
.fmeta div{min-width:0}
.fmeta span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.case{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 230px;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.case:first-of-type{border-top:0}
.case h4{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.tc{font:600 12px var(--f-mono);color:var(--muted)}
.type{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.case ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.exp{font-size:13.5px}
.exp span,.res>span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.res{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:600 11.5px var(--f-body);border:0;border-right:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 2px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="pass"]{background:var(--pass-bg);color:var(--pass)}
.seg button[aria-pressed="true"][data-v="fail"]{background:var(--fail-bg);color:var(--fail)}
.seg button[aria-pressed="true"][data-v="blocked"]{background:var(--blk-bg);color:var(--blk)}
.seg button[aria-pressed="true"][data-v="notbuilt"]{background:var(--nb-bg);color:var(--nb)}
textarea{font:13px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical;min-height:34px;width:100%}
.case.s-pass{box-shadow:inset 3px 0 var(--pass);padding-left:10px}
.case.s-fail{box-shadow:inset 3px 0 var(--fail);padding-left:10px}
.case.s-blocked{box-shadow:inset 3px 0 var(--blk);padding-left:10px}
.case.s-notbuilt{box-shadow:inset 3px 0 var(--nb);padding-left:10px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.guide{display:flex;flex-direction:column;gap:14px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.guide h2{font-family:var(--f-display);font-size:18px;margin:0 0 8px}
.guide h3,.guide h4{font-size:15px;margin:12px 0 6px}
.guide p,.guide li{max-width:80ch}
.tblwrap{overflow-x:auto}
.gtable{border-collapse:collapse;font-size:13.5px;min-width:480px}
.gtable th,.gtable td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
.gtable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.note-ok{color:var(--muted);font-size:12.5px}
@media (max-width:860px){.case{grid-template-columns:1fr}.fstat .mini{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = {"title":"TAVI Desk — manual test plan for untested and partly tested features","intro":"\u003cp>\u003cstrong>Written:\u003c/strong> 4 Nov 2026 · \u003cstrong>For:\u003c/strong> one manual QA tester · \u003cstrong>Environment:\u003c/strong> staging-desk.taviportal.com, tenant \u003cstrong>NDC-Staging\u003c/strong> (company \"Wonder Travel\") · \u003cstrong>Test-data prefix:\u003c/strong> \u003ccode>QA MAN \u003c/code>\u003c/p>\n\u003cp>Sources: \u003ccode>matrix-data.js\u003c/code> (131 features), \u003ccode>spec-desk-go-live.md\u003c/code>, \u003ccode>desk-missing-and-partly.md\u003c/code>, \u003ccode>executions/execu_2026-11-01_desk-golive/PROGRESS.md\u003c/code>, Wave 2 case list \u003ccode>wave2/cases-ndc.md\u003c/code> (reused here), the earlier feature specs under \u003ccode>docs/desk-*\u003c/code> and \u003ccode>docs/crm-desk-integration\u003c/code>, and the NDC usage study \u003ccode>docs/ndc-zoho-desk-gap\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Scope:\u003c/strong> every feature in Waves 2, 3, 4 and 5, plus Q-04 (My profile, only partly checked in Wave 1). Wave 1 is done and left out. Wave 0 and \"Missing\" features have nothing to test yet; they are listed in Appendix A.\u003c/p>","guide":[{"title":"1. How the priority was set","html":"\u003col>\u003cli>\u003cstrong>Start from the inventory priority\u003c/strong> (P0–P2 in \u003ccode>matrix-data.js\u003c/code>).\u003c/li>\u003cli>\u003cstrong>P0 = go-live blockers.\u003c/strong> These are the ticket daily-work core (create, detail, reply/forward, comments, assign, status/close/reopen, list views, notifications bell), the email channel in and out (N-01..N-04), SLA, assignment and workflow runtime, blueprints, Help Center and KB, contacts and accounts, import and export, dashboards, CRM sync, Arabic and performance.\u003c/li>\u003cli>\u003cstrong>Move up\u003c/strong> when NDC really uses the feature: finance departments, workflows, blueprints, SLA, share ticket, phone and chat tickets typed by agents, Desk dashboards (Overview, Request, SLA, TOPUP), and CRM sync of accounts, contacts and products. So Q-03 bell (P1 → P0), N-02 spam/blocked (P1 → P0, part of email in), O-06 products (P2 → P1) and T-38 AI on ticket (P2 → P1) went up.\u003c/li>\u003cli>\u003cstrong>Move down\u003c/strong> when NDC does not use the feature, but keep it in the plan. NDC does not use tags, approvals, time entries, macros, custom functions, webhooks, contracts or Slack. So T-22, T-26, T-27, T-35, U-08, U-13, U-14 and C-04 went down one step (P1 → P2). U-15, X-06, G-02, G-03 and D-05 went from P2 to P3. T-20 spam went from P0 to P1 (NDC has 0 spam use).\u003c/li>\u003cli>\u003cstrong>Inside one priority, features are grouped by area\u003c/strong> (Organisation, Access, Tickets, Automation, Channels, Customers, Insight, Data, Customization, Integrations, Cross-cutting).\u003c/li>\u003c/ol>\n\u003cp>Each feature lists \"Partly covered before\" when earlier feature testing touched it. Those cases focus on what was \u003cstrong>not\u003c/strong> covered.\u003c/p>"},{"title":"2. Summary","html":"\u003cp>\u003cstrong>Features and test cases (features / test cases) by priority and wave\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable class=\"gtable\">\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Wave 1\u003c/th>\u003cth>Wave 2\u003c/th>\u003cth>Wave 3\u003c/th>\u003cth>Wave 4\u003c/th>\u003cth>Wave 5\u003c/th>\u003cth>Total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>P0\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>18 / 149\u003c/td>\u003ctd>8 / 70\u003c/td>\u003ctd>7 / 51\u003c/td>\u003ctd>14 / 108\u003c/td>\u003ctd>\u003cstrong>47 / 378\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>P1\u003c/strong>\u003c/td>\u003ctd>1 / 7\u003c/td>\u003ctd>13 / 87\u003c/td>\u003ctd>2 / 11\u003c/td>\u003ctd>4 / 25\u003c/td>\u003ctd>9 / 61\u003c/td>\u003ctd>\u003cstrong>29 / 191\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>P2\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>8 / 52\u003c/td>\u003ctd>2 / 12\u003c/td>\u003ctd>1 / 7\u003c/td>\u003ctd>6 / 39\u003c/td>\u003ctd>\u003cstrong>17 / 110\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>P3\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>1 / 6\u003c/td>\u003ctd>—\u003c/td>\u003ctd>4 / 26\u003c/td>\u003ctd>\u003cstrong>5 / 32\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\u003ctd>1 / 7\u003c/td>\u003ctd>39 / 288\u003c/td>\u003ctd>13 / 99\u003c/td>\u003ctd>12 / 83\u003c/td>\u003ctd>33 / 234\u003c/td>\u003ctd>\u003cstrong>98 / 711\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Test cases by type:\u003c/strong> functional 214 · edge 106 · negative 102 · persistence 99 · UI-RTL 98 · permission 77 · integration 15.\u003c/p>\n\u003cp>Every feature has at least one happy-path, negative, edge, persistence and Arabic/RTL case. Permission cases are included wherever a role matters.\u003c/p>"},{"title":"3. Suggested execution order (one tester)","html":"\u003cp>About 40–50 cases a day, because email, timers and SLA cases need waiting time. Log bugs at the end of each day. Each day builds on the data of the day before.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable class=\"gtable\">\u003cthead>\u003ctr>\u003cth>Day\u003c/th>\u003cth>What\u003c/th>\u003cth>Cases\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Setup (section 4) + T-04 Create, T-05 Detail, T-06 Reply/forward, T-07 Comments\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>T-12 Assign, T-13 Status/close, Q-03 Bell, T-01 Views, T-02 View modes, T-03 Queues\u003c/td>\u003ctd>49\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>T-14 Move, T-15 Share, T-16 Merge, T-10 Snippets, T-21 Delete/restore, T-24 Attachments\u003c/td>\u003ctd>46\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>T-25 Collision, T-31 Bulk, N-01 Email, N-02 Spam/blocked, N-03 Providers, N-04 Email templates, U-12 Notification rules\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>U-01 Assignment rules, U-02 Round-robin prefs, U-07 SLA, U-04 Workflow rules (start timers early)\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>U-05 Actions, U-06 Reply triggers, U-09 Blueprints, N-05 Web forms, N-06 Help Center\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>N-08 KB, C-01 Contacts, C-02 Accounts, G-01 CRM ⇄ Desk, D-01 Import\u003c/td>\u003ctd>41\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>D-02 Export, D-07 Recycle Bin, X-01 Modules, X-02 Layouts/fields, X-03 Layout/validation rules, I-01 HQ\u003c/td>\u003ctd>43\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>I-02 Reports, I-03 Dashboards, Q-01 Arabic sweep, Q-05 Performance (quiet hour) — \u003cstrong>P0 done\u003c/strong>\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>P1 tickets: T-08, T-09, T-11, T-17, T-19, T-20, T-23, T-29\u003c/td>\u003ctd>54\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>T-33, T-34, T-36, T-38, T-40, U-03 Skills, U-16 Auto-close\u003c/td>\u003ctd>44\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>N-10 Happiness, T-37 Rating on ticket, N-07 Community, N-09 KB translations, C-03 Customer 360, C-05 Activities, O-06 Products, A-12 Retention\u003c/td>\u003ctd>53\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>D-03 Backup, D-04 Migration, D-06 Bulk log, X-05 Languages, G-06 Analytics, Q-04 My profile — \u003cstrong>P1 done\u003c/strong>\u003c/td>\u003ctd>40\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>P2 tickets: T-18, T-22, T-26, T-27, T-28, T-30, T-32, T-35\u003c/td>\u003ctd>52\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>U-08, U-13, U-14, C-04, C-06, I-04, D-08, Q-02, O-08 — \u003cstrong>P2 done\u003c/strong>\u003c/td>\u003ctd>58\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>P3: U-15, X-06, G-02, G-03, D-05 + full cleanup (section 7)\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Dependencies: T-11 needs the KB article from N-08 (day 7). T-36 needs the SLA from U-07 (day 5). U-06-05 needs the happiness link; if it is off, run U-06-05 on day 12 with N-10. C-04 runs right after U-08.\u003c/p>"},{"title":"4. Before you start (setup, about 2 hours on day 1)","html":"\u003cp>\u003cstrong>Accounts (no passwords in this file; use the team credentials sheet):\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable class=\"gtable\">\u003cthead>\u003ctr>\u003cth>Short name\u003c/th>\u003cth>Role\u003c/th>\u003cth>Departments\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Owner\u003c/td>\u003ctd>Tenant owner, all rights\u003c/td>\u003ctd>all\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Admin B\u003c/td>\u003ctd>Desk Administrator\u003c/td>\u003ctd>Marketing (+ Sales for move/share tests)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Agent C\u003c/td>\u003ctd>Desk Agent profile\u003c/td>\u003ctd>Customer Support only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Supervisor S\u003c/td>\u003ctd>Desk Supervisor\u003c/td>\u003ctd>Tech\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Sign each account in once per session, in its own browser or profile (a new sign-in can end the old session). Use two browsers for collision and \"two users at once\" cases.\u003c/p>\n\u003cp>\u003cstrong>Departments:\u003c/strong> Marketing for plain ticket work (no SLA, no blueprint, no assignment rule). Sales as move/share target. Customer Support for Agent C. One \"QA NDC …\" department for every rule, SLA, blueprint, notification and numbering test. Never change Standard layouts or settings of real departments.\u003c/p>\n\u003cp>\u003cstrong>Mailboxes:\u003c/strong> M1 = a test mailbox you control (used as the main contact). M2 = a second test mailbox (CC, forward, portal sign-up, blocked sender). Send mail only to these two.\u003c/p>\n\u003cp>\u003cstrong>Data to make first:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Contact \"QA MAN Contact 1\" (email M1) and account \"QA MAN Account\".\u003c/li>\u003cli>5 tickets in Marketing: \"QA MAN phone 01\", \"QA MAN reply 01\", \"QA MAN assign 01\", \"QA MAN status 01\", \"QA MAN share 01\". Create them with \u003cstrong>no priority and channel Phone\u003c/strong>. The tenant has workflow rules for all departments that add tasks, tags and call records when priority is High/Urgent or the channel is Web. Keep priority edits to Low/Medium unless a case says otherwise.\u003c/li>\u003cli>Files: small .txt, 2 MB .jpg, 5 MB .pdf, 45 MB .zip, a renamed .exe, a file with an Arabic name.\u003c/li>\u003cli>CSV \"qa-man-contacts.csv\" (5 rows: 1 bad email, 1 Arabic name, 1 duplicate) and a 3-row ticket CSV.\u003c/li>\u003cli>A safe test endpoint (for example a webhook.site inbox) for webhook and custom action cases.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Write down before changing:\u003c/strong> take a screenshot of each tenant setting you will touch (numbering, notification rules, business hours, SLA list, portal branding, email channel, retention, archiving). Change them only in a QA department or set them back the same day.\u003c/p>\n\u003cp>\u003cstrong>Live data from the paused Wave 2 run:\u003c/strong> \"QA GL W2\" tickets #781–#794, a macro, template, snippet, tag, view, 2 pending approvals and 2 pending review drafts are still on the tenant. Do not use them; they are in the cleanup list.\u003c/p>"},{"title":"5. How to record results","html":"\u003cp>Fill the \u003cstrong>Result\u003c/strong> column with one of: \u003cstrong>Pass\u003c/strong>, \u003cstrong>Fail\u003c/strong> (+ short note and bug id when filed), \u003cstrong>Blocked\u003c/strong> (+ what blocks it), \u003cstrong>Not built\u003c/strong> (feature not on screen). \"Known\" Plane ids in each feature are open items: if the case still fails the same way, write the id instead of a new bug. Take a screenshot only for failed cases.\u003c/p>"},{"title":"Appendix A — Not testable yet","html":"\u003cp>Wave 0 (Missing / In development / no setup behind it) and features marked Missing in other waves. Nothing to run; check only that they are still absent when a build note says they arrived.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable class=\"gtable\">\u003cthead>\u003ctr>\u003cth>Id\u003c/th>\u003cth>Feature\u003c/th>\u003cth>Status\u003c/th>\u003cth>Wave\u003c/th>\u003cth>Plane\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A-08\u003c/td>\u003ctd>Agent sign-in security: SSO/SAML, 2FA, allowed IPs, session policy\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>1\u003c/td>\u003ctd>NDC-1977, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A-10\u003c/td>\u003ctd>Zia Agents / AI agent seats\u003c/td>\u003ctd>TAVI-only (built-in AI Agent profile, Omnichannel)\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2702\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A-11\u003c/td>\u003ctd>Privacy: data subject requests, attachment controls\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>5\u003c/td>\u003ctd>NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>O-07\u003c/td>\u003ctd>Gamescope (agent gamification)\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T-39\u003c/td>\u003ctd>Ticket translation\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2005, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T-41\u003c/td>\u003ctd>Telephony panel on ticket (click to call)\u003c/td>\u003ctd>Partly (no phone setup behind it)\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2008\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T-42\u003c/td>\u003ctd>Read receipts for replies\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2636, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U-10\u003c/td>\u003ctd>Supervisor rules\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>3\u003c/td>\u003ctd>NDC-1973, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U-11\u003c/td>\u003ctd>Schedules (custom function on a schedule)\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-1989, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-11\u003c/td>\u003ctd>Live chat\u003c/td>\u003ctd>In development\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-12\u003c/td>\u003ctd>Social channels\u003c/td>\u003ctd>In development\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-1667, NDC-2000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-13\u003c/td>\u003ctd>Phone / telephony channel\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-14\u003c/td>\u003ctd>Instant messaging (WhatsApp / Telegram / LINE)\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2000, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-15\u003c/td>\u003ctd>Guided conversations\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-1994, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-16\u003c/td>\u003ctd>ASAP help widget / mobile SDK\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-1995, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N-17\u003c/td>\u003ctd>Help Center SSO\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2264, NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I-05\u003c/td>\u003ctd>Radar / agent mobile app\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-1998\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X-04\u003c/td>\u003ctd>Custom buttons on ticket\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2760\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G-04\u003c/td>\u003ctd>Marketplace / extensions\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2013\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G-05\u003c/td>\u003ctd>Developer space\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>0\u003c/td>\u003ctd>NDC-2009, NDC-2760\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Wave 1 features already passed (O-01..O-05, A-01..A-07, A-09) are not repeated here.\u003c/p>"},{"title":"7. Cleanup checklist (end of day 16, or after each day for heavy items)","html":"\u003cp>Search every module for \"QA MAN\" before you finish. Tick each line.\u003c/p>\n\u003cp>\u003cstrong>Tickets and ticket items\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] Delete all \"QA MAN\" tickets (search \"QA MAN\" in All Tickets, incl. Closed, Spam, Archived and Shared views). Unmerge or unlink parents/children first.\u003c/li>\u003cli>[ ] Remove shares, followers, legal holds and scheduled replies left on QA tickets.\u003c/li>\u003cli>[ ] Delete QA MAN views, snippets, ticket templates, macros, tags, signatures added for tests.\u003c/li>\u003cli>[ ] Recycle Bin: \"Delete forever\" each QA MAN item one by one. \u003cstrong>Do not click Empty Bin\u003c/strong> (it deletes everything after one confirm, NDC-2517). If delete forever fails (NDC-2248), list what stays.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Automation\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] Deactivate, then delete: assignment rules \"QA MAN …\", round-robin preferences set back, skills \"QA MAN …\", workflow rules and saved actions \"QA MAN …\", SLA \"QA MAN SLA\", blueprint \"QA MAN BP\" (move tickets out first), support plan \"QA MAN Gold\", custom action and source, webhook action, AI tagging setting.\u003c/li>\u003cli>[ ] Notification rules of the QA department set back to the screenshot.\u003c/li>\u003cli>[ ] Ticket numbering series of the QA department removed or set back.\u003c/li>\u003cli>[ ] QA business-hours set removed if you made one.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Channels and self service\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] Support address alias \"qa-man\" removed (if added); test SMTP provider removed; live provider untouched.\u003c/li>\u003cli>[ ] M2 removed from blocked list; suppressions untouched.\u003c/li>\u003cli>[ ] Email template \"QA MAN template EN/AR\" deleted.\u003c/li>\u003cli>[ ] Web form \"QA MAN form\" deleted.\u003c/li>\u003cli>[ ] Help Center: branding set back; portal user M2 deactivated/deleted; community topic \"QA MAN topic\" deleted.\u003c/li>\u003cli>[ ] KB: \"QA MAN article\" (and translations, versions), draft article and \"QA MAN cat\" deleted.\u003c/li>\u003cli>[ ] Customer happiness settings of the QA department set back.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Customers, data, customization\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] Contacts \"QA MAN Contact 1/2\", \"QA MAN Dup\", \"QA MAN Imp …\" and accounts \"QA MAN Account/Sub\" deleted (undo the import first).\u003c/li>\u003cli>[ ] Contract, activities (tasks, calls, events \"QA MAN …\"), team feed posts deleted.\u003c/li>\u003cli>[ ] Product \"QA MAN Product\" deleted (Desk and CRM).\u003c/li>\u003cli>[ ] Custom module \"QA MAN Airline\", lookup field, \"QA MAN Layout\", test fields, layout/validation rules and dependent picklist deleted. Standard layout checked unchanged.\u003c/li>\u003cli>[ ] Export files, backup ZIP and any sandbox \"QA MAN sandbox\" removed; retention rule deleted; archiving rule deleted.\u003c/li>\u003cli>[ ] Dashboards \"QA MAN TOPUP\" and custom/scheduled reports deleted.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Integrations and users\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] CRM: \"QA MAN CRM Contact\", account change and product set back or deleted in CRM; failure-log rows retried or discarded. Connection still connected.\u003c/li>\u003cli>[ ] Slack/Teams test workspace disconnected.\u003c/li>\u003cli>[ ] Admin B language set back; accessibility settings set back; My profile signatures and time zone set back for all test accounts.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Old data from the paused Wave 2 run\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] \"QA GL W2\" tickets #781–#794, its macro, template, snippet, tag, view; cancel the 2 pending approvals and 2 pending review drafts.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Final check\u003c/strong>\u003c/p>\n\u003cul>\u003cli>[ ] Compare each tenant setting with the screenshot taken before. Note any difference that was not made by you.\u003c/li>\u003c/ul>"}],"features":[{"id":"T-04","name":"Create ticket (layout per department, templates, quick create)","prio":"P0","area":"Tickets","cases":[{"tc":"T-04-01","type":"functional","stepsHtml":["Click \"+\" in the header › Ticket.","Department = Marketing.","Subject \"QA MAN phone 01\", Contact = QA MAN Contact 1, Channel = Phone, no priority.","Description \"Caller asks about refund\".","Click Save."],"expectedHtml":"Success message (not \"Permission denied\"). Ticket page opens with a new ticket number. Channel shows Phone. Status is the default open status.","titleHtml":"Create a phone ticket from the screen"},{"tc":"T-04-02","type":"functional","stepsHtml":["Sign in as Agent C.","\"+\" › Ticket, department Customer Support.","Subject \"QA MAN chat 01\", Channel = Chat, contact QA MAN Contact 1.","Save."],"expectedHtml":"Ticket created in Customer Support, owner rules as configured, channel Chat. Agent C can open it.","titleHtml":"Create a chat ticket typed by an agent"},{"tc":"T-04-03","type":"negative","stepsHtml":["\"+\" › Ticket.","Leave Subject empty.","Click Save.","Then clear Department (if possible) and Save."],"expectedHtml":"Save is blocked. Each missing field shows an inline message. No ticket is created (check All Tickets).","titleHtml":"Required fields are enforced"},{"tc":"T-04-04","type":"edge","stepsHtml":["Create a ticket with a 255-character subject that starts \"QA MAN long\" and contains Arabic, emoji and \u003ccode>&lt;b&gt;x&lt;/b&gt;\u003c/code>.","Save.","Then try a 1,000-character subject."],"expectedHtml":"255 chars saves and shows as plain text (no bold, no script). 1,000 chars is refused with a clear limit message, or saved in full — record which. No \"unexpected error\".","titleHtml":"Very long and special-character subject"},{"tc":"T-04-05","type":"functional","stepsHtml":["\"+\" › Ticket.","Pick Marketing, note the fields.","Switch department to Tech (or a QA NDC department with its own layout)."],"expectedHtml":"The form changes to that department's layout. Values already typed in shared fields stay.","titleHtml":"Layout follows the department"},{"tc":"T-04-06","type":"functional","stepsHtml":["Create template \"QA MAN template\" in Settings › Tickets › Templates (subject + priority Low).","\"+\" › Ticket › template picker › pick it.","Save."],"expectedHtml":"Fields are pre-filled from the template. Ticket saves with those values.","titleHtml":"Create from a ticket template"},{"tc":"T-04-07","type":"persistence","stepsHtml":["Open \"QA MAN phone 01\".","Reload the page.","Sign out, sign in again, search the ticket number."],"expectedHtml":"All values are the same as saved.","titleHtml":"Ticket survives reload and sign-in"},{"tc":"T-04-08","type":"permission","stepsHtml":["Sign in as Agent C (Customer Support only).","\"+\" › Ticket.","Open the Department list."],"expectedHtml":"Only his departments are offered. He cannot save a ticket into Marketing.","titleHtml":"Agent cannot create in a department he is not in"},{"tc":"T-04-09","type":"ui-rtl","stepsHtml":["Switch the header language to Arabic.","\"+\" › Ticket.","Fill and save \"QA MAN AR 01\"."],"expectedHtml":"Labels and buttons in Arabic, form right-to-left, no raw keys like \u003ccode>desk.tickets.x\u003c/code>, success message in Arabic.","titleHtml":"Create form in Arabic"},{"tc":"T-04-10","type":"integration","stepsHtml":["After T-04-01, open the ticket's Activity / History.","Check Activities and Tags for new items."],"expectedHtml":"Note any task, tag or call that a tenant-wide workflow rule added. With no priority and channel Phone, none should appear. Record and clean any.","titleHtml":"Tenant workflow side effects"}],"day":1,"why":"Every ticket starts here. NDC agents type phone and chat tickets by hand (54 % + 33 % of their volume).","pre":"Signed in as Owner. Department Marketing (no SLA, no rule). Contact \"QA MAN Contact 1\" (create it in Contacts first, email = QA mailbox M1). Known: NDC-2661 (screen create said \"Permission denied\").","partly":"","status":"Built","wave":"2","extra":[]},{"id":"T-05","name":"Ticket detail: properties, conversation, history, tabs, pins","prio":"P0","area":"Tickets","cases":[{"tc":"T-05-01","type":"functional","stepsHtml":["Open the ticket.","Click each tab: Conversation, Resolution, Time, Attachment, Parent-Child, Activity, Approval, History."],"expectedHtml":"Header (subject, status, Reply, Comment, Close) and properties panel show. Every tab opens without error or raw keys.","titleHtml":"Page parts load"},{"tc":"T-05-02","type":"functional","stepsHtml":["Change Subject to \"QA MAN phone 01 edited\".","Set Due date to tomorrow 17:00.","Set priority Low."],"expectedHtml":"Each change saves on its own. A success toast shows.","titleHtml":"Edit properties inline"},{"tc":"T-05-03","type":"functional","stepsHtml":["Open History."],"expectedHtml":"Create, subject, due date and priority changes are listed with the user's name and old → new values. No raw ids or arrays.","titleHtml":"History records each change with names"},{"tc":"T-05-04","type":"negative","stepsHtml":["Set Due date to yesterday."],"expectedHtml":"Refused with a message, or saved and the ticket marked overdue — record which. No crash.","titleHtml":"Due date in the past"},{"tc":"T-05-05","type":"edge","stepsHtml":["Copy the ticket URL.","Change the last 4 characters of the id.","Open it."],"expectedHtml":"\"Not found\" page. No data from another ticket.","titleHtml":"Unknown ticket link"},{"tc":"T-05-06","type":"edge","stepsHtml":["Open the ticket in two browsers (Owner and Admin B).","B changes priority to Medium.","Owner, without reload, changes priori k message on QA ticket create."],"expectedHtml":"Message arrives.","titleHtml":"Notify channel from workflow"},{"tc":"G-02-03","type":"negative","stepsHtml":["Revoke in Slack; trigger."],"expectedHtml":"Failure logged.","titleHtml":"Revoked token"},{"tc":"G-02-04","type":"persistence","stepsHtml":["Reload."],"expectedHtml":"Connected.","titleHtml":"Kept"},{"tc":"G-02-05","type":"permission","stepsHtml":["Agent C."],"expectedHtml":"No access.","titleHtml":"Agent no access"},{"tc":"G-02-06","type":"ui-rtl","stepsHtml":["Arabic text in message."],"expectedHtml":"Readable.","titleHtml":"Arabic"},{"tc":"G-02-07","type":"edge","stepsHtml":["Trigger a message with 1,000 Arabic characters and a ticket link."],"expectedHtml":"Arrives in full; link opens the ticket.","titleHtml":"Long Arabic message with link"}],"day":16,"why":"Lowered: NDC uses Zoho Cliq, which TAVI does not offer. Needs a test Slack/Teams workspace; skip if none.","pre":"","partly":"","status":"Built","wave":"5","extra":[]},{"id":"G-03","name":"API integration config page","prio":"P3","area":"Integrations","cases":[{"tc":"G-03-01","type":"functional","stepsHtml":["Settings › API Integration."],"expectedHtml":"Real page (not HQ) — record.","titleHtml":"Link opens a page"},{"tc":"G-03-02","type":"edge","stepsHtml":["Open /settings/integration-config."],"expectedHtml":"Same result.","titleHtml":"Direct URL"},{"tc":"G-03-03","type":"permission","stepsHtml":["Agent C."],"expectedHtml":"No access.","titleHtml":"Agent no access"},{"tc":"G-03-04","type":"ui-rtl","stepsHtml":["Arabic."],"expectedHtml":"Label Arabic.","titleHtml":"Arabic"},{"tc":"G-03-05","type":"negative","stepsHtml":["Open /settings/integration-config/xyz."],"expectedHtml":"Not found page, no blank screen.","titleHtml":"Unknown sub-path"},{"tc":"G-03-06","type":"persistence","stepsHtml":["Sign in again; click the link."],"expectedHtml":"Same behaviour as G-03-01.","titleHtml":"Same after sign-in"}],"day":16,"why":"Lowered: link opens HQ; only confirm state.","pre":"","partly":"","status":"Partly","wave":"5","extra":[]},{"id":"D-05","name":"Sandbox","prio":"P3","area":"Data","cases":[{"tc":"D-05-01","type":"functional","stepsHtml":["Settings › Data › Sandboxes."],"expectedHtml":"No ERROR.","titleHtml":"Page loads"},{"tc":"D-05-02","type":"functional","stepsHtml":["Create \"QA MAN sandbox\"."],"expectedHtml":"Finishes within 30 min (NDC-2514).","titleHtml":"Create sandbox"},{"tc":"D-05-03","type":"negative","stepsHtml":["Save empty."],"expectedHtml":"Refused.","titleHtml":"Empty name"},{"tc":"D-05-04","type":"persistence","stepsHtml":["Reload."],"expectedHtml":"Listed.","titleHtml":"Kept"},{"tc":"D-05-05","type":"permission","stepsHtml":["Agent C."],"expectedHtml":"No access.","titleHtml":"Agent no access"},{"tc":"D-05-06","type":"ui-rtl","stepsHtml":["Arabic."],"expectedHtml":"RTL.","titleHtml":"Arabic"},{"tc":"D-05-07","type":"edge","stepsHtml":["Start a second sandbox while one is pending."],"expectedHtml":"Refused with a clear message, or both finish.","titleHtml":"Two sandboxes at once"}],"day":16,"why":"Lowered: not needed for go-live; create never finishes (NDC-2514).","pre":"","partly":"","status":"Partly","wave":"5","extra":["---"]}]};
const LABEL = { pass: 'Pass', fail: 'Fail', blocked: 'Blocked', notbuilt: 'Not built' };
const COLOR = { pass: 'var(--pass)', fail: 'var(--fail)', blocked: 'var(--blk)', notbuilt: 'var(--nb)' };
const results = {};          // tc -> {status, note}
let store = null;            // db collection or null
let localMode = false;
const $ = s => document.querySelector(s);
const state = { prios: new Set(), area: '', day: '', res: '', q: '' };

document.getElementById('ttl').textContent = DATA.title.replace(/^TAVI Desk — /, 'TAVI Desk · ');
document.getElementById('intro').innerHTML = DATA.intro;

// guide
$('#view-guide').innerHTML = DATA.guide.map(g => `<section><h2>${g.title.replace(/</g,'&lt;')}</h2>${g.html}</section>`).join('');

// filters
const prios = ['P0', 'P1', 'P2', 'P3'];
$('#prio-chips').innerHTML = prios.map(p => `<button class="chip" data-p="${p}" aria-pressed="false" id="f-prio-${p}">${p}</button>`).join(' ');
$('#prio-chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const p = b.dataset.p; state.prios.has(p) ? state.prios.delete(p) : state.prios.add(p); b.setAttribute('aria-pressed', state.prios.has(p)); render(); });
[...new Set(DATA.features.map(f => f.area))].forEach(a => $('#f-area').insertAdjacentHTML('beforeend', `<option>${a}</option>`));
[...new Set(DATA.features.map(f => f.day).filter(Boolean))].sort((a, b) => a - b).forEach(d => $('#f-day').insertAdjacentHTML('beforeend', `<option value="${d}">Day ${d}</option>`));
$('#f-area').onchange = e => { state.area = e.target.value; render(); };
$('#f-day').onchange = e => { state.day = e.target.value; render(); };
$('#f-res').onchange = e => { state.res = e.target.value; render(); };
let qt; $('#f-q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 150); };
function setTab(t) { $('#tab-cases').setAttribute('aria-selected', t === 'cases'); $('#tab-guide').setAttribute('aria-selected', t === 'guide'); $('#view-cases').hidden = t !== 'cases'; $('#view-guide').hidden = t !== 'guide'; $('#filters').hidden = t !== 'cases'; }
$('#tab-cases').onclick = () => setTab('cases'); $('#tab-guide').onclick = () => setTab('guide');
let allOpen = false; $('#b-open').onclick = () => { allOpen = !allOpen; document.querySelectorAll('details.feat').forEach(d => d.open = allOpen); $('#b-open').textContent = allOpen ? 'Collapse all' : 'Expand all'; };
$('#b-copy').onclick = async () => {
  const rows = []; for (const f of DATA.features) for (const c of f.cases) { const r = results[c.tc]; if (r && (r.status === 'fail' || r.status === 'blocked')) rows.push(`${c.tc}\t${LABEL[r.status]}\t${f.id} ${f.name}\t${(r.note || '').replace(/\s+/g, ' ')}`); }
  const text = rows.length ? 'TC\tResult\tFeature\tNote\n' + rows.join('\n') : 'No failed or blocked cases yet.';
  try { await navigator.clipboard.writeText(text); flash(`Copied ${rows.length} rows`); } catch (e) { flash('Copy not allowed here'); }
};
function flash(t) { const s = $('#save'); const o = s.textContent; s.textContent = t; setTimeout(() => s.textContent = o, 1800); }

function caseMatches(f, c) {
  const r = results[c.tc]; const st = r && r.status || 'none';
  if (state.res && st !== state.res) return false;
  if (state.q) { const hay = (c.tc + ' ' + c.titleHtml + ' ' + c.stepsHtml.join(' ') + ' ' + c.expectedHtml + ' ' + f.id + ' ' + f.name).toLowerCase(); if (!hay.includes(state.q)) return false; }
  return true;
}
function featMatches(f) {
  if (state.prios.size && !state.prios.has(f.prio)) return false;
  if (state.area && f.area !== state.area) return false;
  if (state.day && String(f.day) !== state.day) return false;
  return true;
}
function counts(cases) { const n = { pass: 0, fail: 0, blocked: 0, notbuilt: 0, none: 0 }; for (const c of cases) { const r = results[c.tc]; n[r && r.status || 'none']++; } return n; }
function barHtml(n, total) { return ['pass', 'fail', 'blocked', 'notbuilt'].map(k => n[k] ? `<span style="width:${n[k] / total * 100}%;background:${COLOR[k]}"></span>` : '').join(''); }

function caseHtml(c) {
  const r = results[c.tc] || {}; const st = r.status || '';
  return `<div class="case ${st ? 's-' + st : ''}" data-tc="${c.tc}">
    <div><h4><span class="tc">${c.tc}</span> ${c.titleHtml} <span class="type">${c.type}</span></h4>
      <ol>${c.stepsHtml.map(s => `<li>${s}</li>`).join('')}</ol></div>
    <div class="exp"><span>Expected</span>${c.expectedHtml}</div>
    <div class="res"><span>Result</span>
      <div class="seg" role="group" aria-label="Result for ${c.tc}">${['pass', 'fail', 'blocked', 'notbuilt'].map(v => `<button data-v="${v}" aria-pressed="${st === v}">${LABEL[v]}</button>`).join('')}</div>
      <textarea id="n-${c.tc}" rows="1" placeholder="Note, bug id…">${(r.note || '').replace(/</g, '&lt;')}</textarea></div>
  </div>`;
}

function render() {
  const out = []; let lastKey = ''; let shown = 0;
  for (const f of DATA.features) {
    if (!featMatches(f)) continue;
    const cs = f.cases.filter(c => caseMatches(f, c)); if (!cs.length) continue;
    const key = f.prio + '·' + f.area;
    if (key !== lastKey) { out.push(`<h2 class="area-h"><span class="prio ${f.prio}">${f.prio}</span>${f.area}</h2>`); lastKey = key; }
    const n = counts(f.cases); const done = f.cases.length - n.none;
    out.push(`<details class="feat" data-f="${f.id}" ${openSet.has(f.id) ? 'open' : ''}><summary>
      <span class="fid">${f.id}</span><span class="fname">${f.name}<small>Wave ${f.wave || '—'} · ${f.status}${f.day ? ' · Day ' + f.day : ''} · ${f.cases.length} cases</small></span>
      <span class="fstat"><span class="mini">${barHtml(n, f.cases.length)}</span>${done}/${f.cases.length}</span></summary>
      <div class="fbody"><div class="fmeta">
        ${f.why ? `<div><span>Why this priority</span>${f.why}</div>` : ''}
        ${f.pre ? `<div><span>Preconditions / data</span>${f.pre}</div>` : ''}
        ${f.partly ? `<div><span>Partly covered before</span>${f.partly}</div>` : ''}
        ${f.extra.length ? `<div><span>Notes</span>${f.extra.join('<br>')}</div>` : ''}
      </div>${cs.map(caseHtml).join('')}</div></details>`);
    shown += cs.length;
  }
  $('#view-cases').innerHTML = out.length ? out.join('') : '<div class="empty">No cases match these filters.</div>';
  summary();
}
function summary() {
  const all = DATA.features.flatMap(f => f.cases); const n = counts(all);
  $('#track').innerHTML = barHtml(n, all.length);
  $('#legend').innerHTML = `<span><b>${all.length - n.none}</b> of ${all.length} run</span>` + ['pass', 'fail', 'blocked', 'notbuilt'].map(k => `<span><i class="dot" style="background:${COLOR[k]}"></i>${LABEL[k]} <b>${n[k]}</b></span>`).join('') + `<span>Not run <b>${n.none}</b></span>`;
}
const openSet = new Set();
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.feat')) d.open ? openSet.add(d.dataset.f) : openSet.delete(d.dataset.f); }, true);

// writing results
async function persist(tc) {
  const r = results[tc] || {};
  if (localMode) { try { localStorage.setItem('mtp-results', JSON.stringify(results)); } catch (e) {} return; }
  if (!store) return;
  try {
    if (!r.status && !r.note) await store.doc(tc).delete(); else await store.doc(tc).set({ status: r.status || '', note: r.note || '', at: new Date().toISOString() });
    $('#save').textContent = 'Saved'; $('#save').classList.remove('warn');
  } catch (e) { $('#save').textContent = e && e.code === 'invalid_argument' ? 'You can view results but not change them' : 'Not saved — try again'; $('#save').classList.add('warn'); }
}
function refreshCase(tc) {
  const el = document.querySelector(`.case[data-tc="${tc}"]`); if (!el) return;
  const st = (results[tc] || {}).status || '';
  el.className = 'case' + (st ? ' s-' + st : '');
  el.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st));
  const d = el.closest('details.feat'); if (d) { const f = DATA.features.find(x => x.id === d.dataset.f); const n = counts(f.cases); d.querySelector('.mini').innerHTML = barHtml(n, f.cases.length); d.querySelector('.fstat').lastChild.textContent = (f.cases.length - n.none) + '/' + f.cases.length; }
  summary();
}
$('#view-cases').addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if (!b) return;
  const tc = b.closest('.case').dataset.tc; const r = results[tc] || (results[tc] = {});
  r.status = r.status === b.dataset.v ? '' : b.dataset.v; refreshCase(tc); persist(tc);
});
const noteTimers = {};
$('#view-cases').addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return; const tc = e.target.closest('.case').dataset.tc;
  (results[tc] || (results[tc] = {})).note = e.target.value;
  clearTimeout(noteTimers[tc]); $('#save').textContent = 'Saving…'; noteTimers[tc] = setTimeout(() => persist(tc), 900);
});

render();

// storage: shared db, fallback to this browser
(async () => {
  const timer = setTimeout(() => { if (!store) { $('#save').textContent = 'Results not reachable yet'; $('#save').classList.add('warn'); } }, 10000);
  let db = null; try { db = window.claude && await window.claude.use('db'); } catch (e) {}
  if (!db) {
    clearTimeout(timer); localMode = true;
    try { Object.assign(results, JSON.parse(localStorage.getItem('mtp-results') || '{}')); } catch (e) {}
    $('#save').textContent = 'Saving in this browser only'; $('#save').classList.add('warn'); render(); return;
  }
  store = db.collection('results');
  store.onSnapshot(snap => {
    clearTimeout(timer);
    for (const k of Object.keys(results)) if (!snap.docs.find(d => d.id === k) && !noteTimers[k]) delete results[k];
    for (const d of snap.docs) { const v = d.data() || {}; const active = document.activeElement && document.activeElement.id === 'n-' + d.id; results[d.id] = { status: v.status || '', note: active ? (results[d.id] || {}).note : (v.note || '') }; }
    if (!snap.metadata.fromCache) { $('#save').textContent = 'Results saved for everyone with this link'; $('#save').classList.remove('warn'); }
    const act = document.activeElement && document.activeElement.id; render();
    if (act) { const el = document.getElementById(act); if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; } }
  }, err => { clearTimeout(timer); $('#save').textContent = 'Results unavailable'; $('#save').classList.add('warn'); });
})();
</script>
