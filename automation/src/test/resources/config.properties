# Shared settings (committed). Put secrets and personal overrides in config.local.properties (gitignored),
# or pass -Dkey=value / env KEY_NAME on the command line.

# --- application ---
base.url=https://staging-desk.taviportal.com
browser=edge
headless=false
window.size=1600,900
# browser.userAgent=  (set a normal UA if a site rejects headless browsers)

# --- timing ---
timeout.seconds=20
pageLoad.timeout.seconds=90
# eager: get() returns once the DOM is parsed (staging serves some assets very slowly); element waits do the rest
pageLoad.strategy=eager
pageLoad.settleSeconds=10

# --- self-healing ---
# true: a working fallback is promoted to the top of locators.json (review with git diff)
healing.autoUpdate=true
# a fallback is trusted only after the primary failed this long (avoids false heals on slow pages)
healing.graceMs=2500
# 0..1 similarity needed to adopt an element by fingerprint when every candidate fails
healing.fingerprintThreshold=0.6

# --- authentication (log in once, reuse the session; see .auth/) ---
credentials.file=../docs/Credentials/TAVI Staging Desk Credentials.csv
credentials.account=ndc-staging-owner
auth.loginPath=/login
auth.checkPath=/
auth.loginUrlPattern=/login|/sign-?in
auth.maxAgeMinutes=240
auth.settleMs=3000
# how long to watch for a redirect to the login page when checking a saved session
auth.checkSeconds=15

# --- API ---
# api.baseUrl defaults to base.url + /api/v1
api.headers=x-app-key: desk
# Desk keeps the bearer token in the readable cookie aw_<env>_access_token (aw_staging_access_token on staging),
# verified 12 Oct 2026: GET /api/v1/workflow/rules with it + x-app-key returns 200.
api.tokenScript=const m = document.cookie.match(/(?:^|; )aw_[a-z]+_access_token=([^;]+)/); return m ? decodeURIComponent(m[1]) : null;

# --- evidence (failed tests only) ---
evidence.dir=target/evidence
keepBrowserOpen=false
